name: Enrollment Identity

on:
  pull_request:
    paths:
      - 'agents/**'
      - 'config/**'
      - 'dashboard/**'
      - 'requirements.txt'
      - '.github/workflows/enrollment-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enrollment-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Identity regression (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nightowl_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: nightowl_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: 'True'
      DJANGO_SECRET_KEY: synthetic-enrollment-ci-key-not-production
      DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql://nightowl_test:isolated-ci-only@localhost:5432/nightowl_test' || 'sqlite:///:memory:' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Django and schema checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          git diff --check
      - name: Identity, ingestion, lifecycle and enrollment regressions
        run: >-
          python manage.py test agents dashboard.test_remote_install_enrollment
          dashboard.test_agent_install_workflow --noinput --verbosity 1
      - name: PostgreSQL concurrency gate (no SQLite substitution)
        if: matrix.database == 'postgresql'
        run: >-
          python manage.py test
          agents.test_enrollment_identity.PostgreSQLEnrollmentIdentityTests
          agents.test_enrollment_identity.IdentityAuditTests --noinput --verbosity 2
