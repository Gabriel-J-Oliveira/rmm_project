name: Enrollment Identity

on:
  pull_request:
    paths:
      - 'agents/**'
      - 'config/**'
      - 'dashboard/**'
      - 'requirements.txt'
      - 'NightOwl.Agent.*/**'
      - 'tests/**'
      - 'static/**'
      - '.github/workflows/enrollment-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enrollment-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Identity regression (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nightowl_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: nightowl_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: 'True'
      DJANGO_SECRET_KEY: synthetic-enrollment-ci-key-not-production
      DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql://nightowl_test:isolated-ci-only@localhost:5432/nightowl_test' || 'sqlite:///:memory:' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Django and schema checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          git diff --check
      - name: Identity, ingestion, lifecycle and enrollment regressions
        run: >-
          python manage.py test agents dashboard.test_remote_install_enrollment
          dashboard.test_agent_install_workflow --exclude-tag windows_e2e --noinput --verbosity 1
      - name: PostgreSQL concurrency gate (no SQLite substitution)
        if: matrix.database == 'postgresql'
        run: >-
          python manage.py test
          agents.test_enrollment_identity.PostgreSQLEnrollmentIdentityTests
          agents.test_enrollment_identity.IdentityAuditTests
          agents.test_manual_batch_postgresql --noinput --verbosity 2

  windows-e2e:
    name: Windows .NET and terminal E2E
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test_browser
      DJANGO_DEBUG: 'True'
      DJANGO_SECRET_KEY: synthetic-enrollment-ci-key-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Build the Windows agent test executable
        run: dotnet build NightOwl.Agent.Windows.Tests/NightOwl.Agent.Windows.Tests.csproj -c Release
      - name: Verify updater signature requirements
        run: |
          dotnet build NightOwl.Agent.Updater.Tests/NightOwl.Agent.Updater.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./NightOwl.Agent.Updater.Tests/bin/Release/net8.0-windows/NightOwl.Agent.Updater.Tests.exe --signature-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose Windows E2E identity
        run: dotnet NightOwl.Agent.Windows.Tests/bin/Release/net8.0-windows/NightOwl.Agent.Windows.Tests.dll --ci-terminal-facts
      - name: Verify required Windows E2E selection
        run: python manage.py test agents.test_ci_partition --noinput --verbosity 2
      - name: Run real Windows .NET, ConPTY and browser contracts
        run: ./scripts/Invoke-WindowsE2E.ps1

  windows-bootstrap:
    name: Windows deployment contract
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: 'True'
      DJANGO_SECRET_KEY: synthetic-enrollment-ci-key-not-production
      DATABASE_URL: 'sqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Execute Windows-only bootstrap contracts on Windows
        run: python manage.py test agents.tests.AgentDeploymentTokenTests --noinput --verbosity 2
