<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("deskCreateWizard");
    const priority = document.getElementById("deskPriority");
    const vip = document.getElementById("deskVipToggle");
    const vipExplanation = document.querySelector("[data-vip-explanation]");
    const draftBox = document.querySelector("[data-draft-key]");
    const draftKey = draftBox ? draftBox.dataset.draftKey : "nightowl.ticket.create.draft";
    const fields = Array.from(document.querySelectorAll("[data-draft-field]"));

    function showStep(step) {
        document.querySelectorAll("[data-create-step]").forEach(function (node) {
            node.classList.toggle("is-active", node.dataset.createStep === String(step));
        });
    }

    document.querySelectorAll("[data-next-step]").forEach(function (button) {
        button.addEventListener("click", function () { showStep(2); });
    });
    document.querySelectorAll("[data-prev-step]").forEach(function (button) {
        button.addEventListener("click", function () { showStep(1); });
    });

    document.querySelectorAll("[data-category-pick]").forEach(function (button) {
        button.addEventListener("click", function () {
            const input = document.querySelector("[data-category-input]");
            if (input) input.value = button.dataset.categoryPick;
            if (priority && button.dataset.priorityPick) priority.value = button.dataset.priorityPick;
            saveDraft();
        });
    });

    document.querySelectorAll("[data-requester-pick]").forEach(function (button) {
        button.addEventListener("click", function () {
            const map = {
                requester_search: button.dataset.requesterPick,
                requester_name: button.dataset.requesterPick,
                requester_email: button.dataset.requesterEmail,
                requester_username: button.dataset.requesterUsername,
                requester_department: button.dataset.requesterDepartment,
                requester_role: button.dataset.requesterRole
            };
            Object.keys(map).forEach(function (name) {
                const input = document.querySelector("[name='" + name + "']");
                if (input) input.value = map[name] || "";
            });
            if (vip) {
                vip.checked = button.dataset.requesterVip === "1";
                updateVipState();
            }
            saveDraft();
        });
    });

    function updateVipState() {
        if (!vip || !priority) return;
        if (vip.checked) {
            priority.value = "critical";
            priority.classList.add("desk-critical-input");
            if (vipExplanation) vipExplanation.hidden = false;
        } else {
            priority.classList.remove("desk-critical-input");
            if (vipExplanation) vipExplanation.hidden = true;
        }
    }

    if (vip) vip.addEventListener("change", function () {
        updateVipState();
        saveDraft();
    });

    function saveDraft() {
        const data = {};
        fields.forEach(function (field) {
            data[field.name] = field.type === "checkbox" ? field.checked : field.value;
        });
        localStorage.setItem(draftKey, JSON.stringify(data));
    }

    function restoreDraft() {
        const raw = localStorage.getItem(draftKey);
        if (!raw) return;
        try {
            const data = JSON.parse(raw);
            fields.forEach(function (field) {
                if (!(field.name in data)) return;
                if (field.type === "checkbox") {
                    field.checked = Boolean(data[field.name]);
                } else {
                    field.value = data[field.name];
                }
            });
            updateVipState();
        } catch (error) {}
    }

    fields.forEach(function (field) {
        field.addEventListener("change", saveDraft);
        field.addEventListener("blur", saveDraft);
    });

    const restore = document.querySelector("[data-draft-restore]");
    if (restore) restore.addEventListener("click", restoreDraft);

    const email = document.querySelector("[data-email-input]");
    if (email) {
        email.addEventListener("blur", function () {
            email.classList.toggle("desk-invalid-input", Boolean(email.value && !email.checkValidity()));
        });
    }

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && fields.some(function (field) { return field.type === "checkbox" ? field.checked : field.value; })) {
            if (confirm("Cancelar a criacao e voltar para a Central?")) {
                window.location.href = "{% url 'tickets:central' %}";
            }
        }
        if (event.key === "Enter" && form && document.activeElement && document.activeElement.tagName !== "TEXTAREA") {
            const activeStep = document.querySelector("[data-create-step].is-active");
            if (activeStep && activeStep.dataset.createStep === "1") {
                event.preventDefault();
                showStep(2);
            }
        }
    });
});
</script>
