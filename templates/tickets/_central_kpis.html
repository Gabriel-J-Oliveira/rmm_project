<section class="desk-kpi-strip" aria-label="Indicadores da central">
    {% for kpi in central_kpis %}
    <a href="{% url 'tickets:central' %}{{ kpi.url }}" class="desk-kpi-link {{ kpi.variant|default:'' }}">
        <span class="desk-kpi-topline"><i data-lucide="{{ kpi.icon }}"></i><em>{{ kpi.trend }}</em></span>
        <span>{{ kpi.label }}</span>
        <strong>{{ kpi.value }}</strong>
        <small class="desk-kpi-spark">
            {% for point in kpi.spark %}<i style="height: {{ point }}px"></i>{% endfor %}
        </small>
    </a>
    {% endfor %}
</section>
