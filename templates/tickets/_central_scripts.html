            </form>` : '<div class="desk-comment-dock desk-readonly-note"><span>Chamado em modo somente leitura.</span></div>'}
        `;
        selectedTicketId = String(ticket.number);
        focusedTicketId = String(ticket.number);
        rows().forEach((row) => {
            row.classList.toggle('is-selected', row.dataset.ticket === selectedTicketId);
            row.classList.toggle('is-key-focused', row.dataset.ticket === focusedTicketId);
        });
        window.history.replaceState({}, '', `${centralUrl}?ticket=${ticket.number}&view={{ view_mode }}`);
        setTimeout(() => previewPanel.classList.remove('is-switching'), 180);
        window.lucide?.createIcons?.();
    }

    function selectTicketForPreview(ticketId) {
        const ticket = getTicket(ticketId);
        if (ticket) renderPreview(ticket);
    }

    function refreshSelection() {
        const visible = getVisibleTicketRows();
        const selectedChecks = checks().filter((item) => item.checked);
        const visibleChecks = visible.map((row) => row.querySelector('.desk-row-checkbox')).filter(Boolean);
        if (selectedLabel) selectedLabel.textContent = selectedChecks.length;
        if (selectionBar) {
            selectionBar.hidden = selectedChecks.length === 0;
            selectionBar.dataset.selectedCount = selectedChecks.length;
        }
        if (checkAll) {
            const selectedVisible = visibleChecks.filter((check) => check.checked).length;
            checkAll.checked = visibleChecks.length > 0 && selectedVisible === visibleChecks.length;
            checkAll.indeterminate = selectedVisible > 0 && selectedVisible < visibleChecks.length;
        }
    }

    function selectedTickets() {
        return checks()
            .filter((check) => check.checked)
            .map((check) => check.closest(rowSelector)?.dataset.ticket)
            .filter(Boolean)
            .map(getTicket)
            .filter(Boolean);
    }

    function addTicketEvent(ticket, text, icon = 'activity', author = CURRENT_TECH) {
        ticket.events = ticket.events || [];
        ticket.events.unshift({ icon, text, when: 'agora', author });
    }

    function applyServerTicket(ticket, serverTicket = {}) {
        if (!ticket || !serverTicket) return;
        ticket.status = serverTicket.status || ticket.status;
        ticket.status_label = serverTicket.statusLabel || ticket.status_label;
        ticket.priority = serverTicket.priority || ticket.priority;
        ticket.priority_label = serverTicket.priorityLabel || ticket.priority_label;
        ticket.category = serverTicket.category || ticket.category;
        ticket.category_icon = serverTicket.categoryIcon || ticket.category_icon;
        ticket.category_color = serverTicket.categoryColor || ticket.category_color;
        ticket.queue = serverTicket.queue || ticket.queue;
        ticket.sla = serverTicket.sla || ticket.sla;
        ticket.sla_label = serverTicket.slaLabel || ticket.sla_label;
        ticket.sla_state = serverTicket.slaLevel || ticket.sla_state;
        ticket.due_at = serverTicket.dueAt || ticket.due_at;
        ticket.assigned_to = serverTicket.assignedTo ?? ticket.assigned_to;
        ticket.title = serverTicket.title || ticket.title;
        ticket.updated_for = 'agora';
    }

    function updateRowFromTicket(ticketId) {
        const ticket = getTicket(ticketId);
        const row = getRow(ticketId);
        if (!ticket || !row) return;
        updateKanbanCardFromTicket(ticketId);
        row.dataset.status = ticket.status;
        row.dataset.priority = ticket.priority;
        row.dataset.technician = ticket.assigned_to || 'Sem responsavel';
        row.dataset.category = ticket.category || '';
        row.dataset.queue = ticket.queue || '';
        row.dataset.sla = ticket.sla_state || '';
        row.dataset.unassigned = ticket.assigned_to ? '0' : '1';
        row.classList.toggle('is-unassigned', !ticket.assigned_to);
        row.classList.remove('priority-low', 'priority-normal', 'priority-high', 'priority-critical');
        row.classList.add(`priority-${ticket.priority}`);
        row.classList.remove('sla-ok', 'sla-warning', 'sla-critical');
        if (ticket.sla_state) row.classList.add(`sla-${ticket.sla_state}`);

        const statusBadge = row.querySelector('.desk-badge[class*="status-"]');
        if (statusBadge) {
            statusBadge.className = `desk-badge status-${badgeClass(ticket.status)}`;
            statusBadge.textContent = ticket.status_label;
        }
        const pill = row.querySelector('.desk-assignee-pill');
        if (pill) {
            pill.classList.toggle('is-unassigned', !ticket.assigned_to);
            const assignee = ticket.assigned_to || 'Sem dono';
            pill.innerHTML = `<span class="desk-avatar">${escapeHtml(assignee.slice(0, 1))}</span>${escapeHtml(assignee)}`;
        }
        const sla = row.querySelector('.desk-sla-cell');
        if (sla) {
            sla.innerHTML = `
                <span class="desk-sla-indicator priority-${badgeClass(ticket.priority)} sla-${badgeClass(ticket.sla_state)}">
                    <i data-lucide="${ticket.priority === 'critical' ? 'siren' : 'clock-3'}"></i>
                    <span>${escapeHtml(ticket.priority_label)}</span>
                </span>
                <small>${escapeHtml(ticket.sla_label || 'Sem SLA')}</small>
            `;
        }
        const time = row.querySelector('.desk-row-time');
        if (time) {
            time.innerHTML = `<strong>${escapeHtml(ticket.updated_for || 'agora')}</strong><small>aberto ha ${escapeHtml(ticket.opened_for || '--')}</small>`;
        }
        window.lucide?.createIcons?.();
    }

    async function updateTicketField(ticketId, field, value, successMessage = 'Chamado atualizado.', extraPayload = {}) {
        const ticket = getTicket(ticketId);
        if (!ticket) return null;
        const data = await postTicketJson(ticketId, 'update', { field, value, ...extraPayload });
        applyServerTicket(ticket, data.ticket);
        updateRowFromTicket(ticketId);
        addTicketEvent(ticket, `Alterou ${field}`, 'activity');
        if (selectedTicketId === String(ticketId)) renderPreview(ticket);
        window.nwRefreshCentralFilters?.();
        showToast(successMessage, 'success');
        return data;
    }

    async function setAssignee(ticketId, assignee = CURRENT_TECH) {
        const ticket = getTicket(ticketId);
        if (!ticket) return;
        const previous = ticket.assigned_to;
        try {
            await updateTicketField(ticketId, 'assigned_to', assignee, `Chamado #${ticket.number} atribuido a voce.`);
            addTicketEvent(ticket, `${assignee} assumiu o chamado`, 'user-round-check', assignee);
            showToast(`Chamado #${ticket.number} atribuido a voce.`, 'success', 'Desfazer', async () => {
                try {
                    await updateTicketField(ticketId, 'assigned_to', previous || '', 'Atribuicao desfeita.');
                } catch (error) {
                    showToast(error.message || 'Nao foi possivel desfazer.', 'warning');
                }
            });
        } catch (error) {
            showToast(error.message || 'Nao foi possivel assumir o chamado.', 'warning');
        }
    }

    async function updatePriority(ticketId, next) {
        const ticket = getTicket(ticketId);
        if (!ticket) return;
        if (next === 'critical') {
            showToast('Prioridade critica aplicada. Justificativa registrada na auditoria.', 'warning');
        }
        try {
            await updateTicketField(ticketId, 'priority', next, `Prioridade alterada para ${PRIORITY_LABELS[next]}.`);
            addTicketEvent(ticket, `Prioridade alterada para ${PRIORITY_LABELS[next]}`, 'flag');
        } catch (error) {
            showToast(error.message || 'Nao foi possivel alterar prioridade.', 'warning');
        }
    }

    function cyclePriority(ticketId) {
        const order = ['low', 'normal', 'high', 'critical'];
        const ticket = getTicket(ticketId);
        if (!ticket) return;
        updatePriority(ticketId, order[(order.indexOf(ticket.priority) + 1) % order.length] || 'normal');
    }

    async function updateStatus(ticketId, next, reason = '') {
        const ticket = getTicket(ticketId);
        if (!ticket) return null;
        const previousStatus = ticket.status;
        try {
            const result = await updateTicketField(ticketId, 'status', next, `Status atualizado para ${STATUS_LABELS[next] || next}.`, { reason });
            if (previousStatus === 'resolved' && next === 'in_progress') {
                ticket.is_reopened = true;
                const row = getRow(ticketId);
                if (row) row.dataset.reopened = '1';
                updateKanbanCardFromTicket(ticketId);
            }
            addTicketEvent(ticket, `Status alterado para ${ticket.status_label}`, 'workflow');
            return result;
        } catch (error) {
            showToast(error.message || 'Nao foi possivel alterar status.', 'warning');
            return null;
        }
    }

    function cycleStatus(ticketId) {
        const ticket = getTicket(ticketId);
        if (!ticket) return;
        const options = STATUS_TRANSITIONS[ticket.status] || ['in_progress'];
        const next = options[0] || 'in_progress';
        if (SENSITIVE_STATUS.has(next)) openReasonDialog(`Mudar status para ${STATUS_LABELS[next]}`, (reason) => updateStatus(ticketId, next, reason));
        else updateStatus(ticketId, next);
    }

    function copyTicketLink(ticketId) {
        const ticket = getTicket(ticketId);
        if (!ticket) return;
        const url = new URL(ticketUrl(ticket), window.location.origin).toString();
        navigator.clipboard?.writeText(url).catch(() => {});
        showToast('Link do chamado copiado.', 'success');
    }

    function closeActionMenus() {
        document.querySelectorAll('.nw-preview-action-menu').forEach((menu) => menu.remove());
    }

    function positionActionMenu(menu, anchor) {
        document.body.appendChild(menu);
        const rect = anchor?.getBoundingClientRect?.();
        if (rect) {
            menu.style.left = `${Math.min(rect.left, window.innerWidth - 260)}px`;
            menu.style.top = `${Math.min(rect.bottom + 8, window.innerHeight - menu.offsetHeight - 12)}px`;
        } else {
            const panel = previewPanel?.getBoundingClientRect();
            menu.style.left = `${Math.max(12, (panel?.left || 24) + 24)}px`;
            menu.style.top = `${Math.max(12, (panel?.top || 24) + 120)}px`;
        }
    }

    function openStatusMenu(ticketId, anchor) {
        const ticket = getTicket(ticketId);
        if (!ticket) return;
        closeActionMenus();
        const menu = document.createElement('div');
        menu.className = 'nw-preview-action-menu';
        menu.innerHTML = `<strong>Mudar status</strong>${(STATUS_TRANSITIONS[ticket.status] || ['in_progress']).map((status) => `<button type="button" data-status="${status}">${STATUS_LABELS[status] || status}${SENSITIVE_STATUS.has(status) ? '<small>pede motivo</small>' : ''}</button>`).join('')}`;
        menu.querySelectorAll('[data-status]').forEach((button) => button.addEventListener('click', () => {
            const next = button.dataset.status;
            closeActionMenus();
            if (SENSITIVE_STATUS.has(next)) openReasonDialog(`Mudar status para ${STATUS_LABELS[next]}`, (reason) => updateStatus(ticketId, next, reason));
            else updateStatus(ticketId, next);
        }));
        positionActionMenu(menu, anchor);
    }

    function openPriorityMenu(ticketId, anchor) {
        closeActionMenus();
        const menu = document.createElement('div');
        menu.className = 'nw-preview-action-menu';
        menu.innerHTML = `<strong>Mudar prioridade</strong>${Object.entries(PRIORITY_LABELS).map(([value, label]) => `<button type="button" data-priority="${value}">${label}${value === 'critical' ? '<small>pede justificativa</small>' : ''}</button>`).join('')}`;
        menu.querySelectorAll('[data-priority]').forEach((button) => button.addEventListener('click', () => {
            const next = button.dataset.priority;
            closeActionMenus();
            if (next === 'critical') openReasonDialog('Justificar prioridade critica', () => updatePriority(ticketId, next));
            else updatePriority(ticketId, next);
        }));
        positionActionMenu(menu, anchor);
    }

    function openMacroMenu(anchor) {
        const textarea = previewPanel?.querySelector('.desk-comment-dock textarea');
        if (!textarea) return;
        closeActionMenus();
        const menu = document.createElement('div');
        menu.className = 'nw-preview-action-menu nw-preview-action-menu--wide';
        menu.innerHTML = `<strong>Macros rapidas</strong>${MACROS.map((macro) => `<button type="button" data-macro="${escapeHtml(macro)}">${escapeHtml(macro)}</button>`).join('')}`;
        menu.querySelectorAll('[data-macro]').forEach((button) => button.addEventListener('click', () => {
            textarea.value = textarea.value ? `${textarea.value}\n${button.dataset.macro}` : button.dataset.macro;
            textarea.focus();
            closeActionMenus();
        }));
        positionActionMenu(menu, anchor);
    }

    function openReasonDialog(title, onConfirm) {
        const dialog = document.createElement('dialog');
        dialog.className = 'nw-bulk-dialog nw-reason-dialog';
        dialog.innerHTML = `
            <form method="dialog">
                <header>
                    <div><span>Confirmacao</span><h2>${escapeHtml(title)}</h2><p>Informe uma justificativa curta para registrar no historico do chamado.</p></div>
                    <button type="button" class="desk-icon-action" data-reason-close aria-label="Fechar"><i data-lucide="x"></i></button>
                </header>
                <label class="nw-bulk-dialog__comment"><span>Motivo</span><textarea rows="3" placeholder="Ex.: validado com o solicitante..."></textarea></label>
                <footer><button class="desk-btn" value="cancel">Cancelar</button><button class="desk-btn desk-btn-primary" value="confirm">Confirmar</button></footer>
            </form>
        `;
        document.body.appendChild(dialog);
        dialog.querySelector('[data-reason-close]').addEventListener('click', () => dialog.close());
        dialog.addEventListener('close', () => dialog.remove());
        dialog.querySelector('[value="confirm"]').addEventListener('click', (event) => {
            const reason = dialog.querySelector('textarea')?.value?.trim() || '';
            if (!reason) {
                event.preventDefault();
                showToast('Informe um motivo para continuar.', 'warning');
                return;
            }
            onConfirm?.(reason);
            showToast('Justificativa registrada.', 'success');
        });
        dialog.showModal();
        window.lucide?.createIcons?.();
    }

    function needsKanbanReason(ticket, nextStatus) {
        return nextStatus === 'waiting_user'
            || nextStatus === 'waiting_third_party'
            || nextStatus === 'resolved'
            || nextStatus === 'closed'
            || nextStatus === 'canceled'
            || (nextStatus === 'in_progress' && ticket?.status === 'resolved');
    }

    function openKanbanTransitionDialog(ticket, nextStatus, onConfirm) {
        const isResolution = nextStatus === 'resolved';
        const isWaiting = nextStatus === 'waiting_user';
        const isReopen = nextStatus === 'in_progress' && ticket?.status === 'resolved';
        const title = isResolution
            ? 'Resolver chamado'
            : isWaiting
                ? 'Aguardar usuario'
                : isReopen
                    ? 'Reabrir chamado'
                    : `Mover para ${STATUS_LABELS[nextStatus] || nextStatus}`;
        const label = isResolution
            ? 'Solucao aplicada'
            : isWaiting
                ? 'Mensagem publica ao solicitante'
                : isReopen
                    ? 'Motivo da reabertura'
                    : 'Motivo';
        const hint = isResolution
            ? 'A solucao ficara visivel ao solicitante e gerara notificacao.'
            : isWaiting
                ? 'Esta mensagem sera publica e enviada ao solicitante.'
                : isReopen
                    ? 'A reabertura sera registrada na timeline publica.'
                    : 'A justificativa sera registrada no historico do chamado.';
        const dialog = document.createElement('dialog');
        dialog.className = 'nw-bulk-dialog nw-reason-dialog nw-kanban-transition-dialog';
        dialog.innerHTML = `
            <form method="dialog">
                <header>
                    <div><span>Workflow</span><h2>${escapeHtml(title)}</h2><p>Chamado #${escapeHtml(ticket?.number)} - ${escapeHtml(ticket?.title || '')}</p></div>
                    <button type="button" class="desk-icon-action" data-reason-close aria-label="Fechar"><i data-lucide="x"></i></button>
                </header>
                <label class="nw-bulk-dialog__comment">
                    <span>${escapeHtml(label)}</span>
                    <textarea rows="4" placeholder="${escapeHtml(hint)}"></textarea>
                    <small>${escapeHtml(hint)}</small>
                </label>
                <footer><button class="desk-btn" value="cancel">Cancelar</button><button class="desk-btn desk-btn-primary" value="confirm">Confirmar</button></footer>
            </form>
        `;
        document.body.appendChild(dialog);
        dialog.querySelector('[data-reason-close]').addEventListener('click', () => dialog.close());
        dialog.addEventListener('close', () => dialog.remove());
        dialog.querySelector('[value="confirm"]').addEventListener('click', (event) => {
            const value = dialog.querySelector('textarea')?.value?.trim() || '';
            if (!value) {
                event.preventDefault();
                showToast(`${label} e obrigatorio.`, 'warning');
                return;
            }
            onConfirm?.(value);
        });
        dialog.showModal();
        dialog.querySelector('textarea')?.focus();
        window.lucide?.createIcons?.();
    }

    async function moveKanbanTicket(ticketId, nextStatus, reason = '') {
        const ticket = getTicket(ticketId);
        if (!ticket || ticket.status === nextStatus) return true;
        const allowed = STATUS_TRANSITIONS[ticket.status] || [];
        if (!allowed.includes(nextStatus)) {
            showToast(`Transicao de ${ticket.status_label} para ${STATUS_LABELS[nextStatus] || nextStatus} nao permitida.`, 'warning');
            return false;
        }
        if (ticket.status === 'new' && nextStatus === 'in_progress' && !ticket.assigned_to) {
            try {
                await updateTicketField(ticketId, 'assigned_to', CURRENT_TECH, `Chamado #${ticket.number} assumido e iniciado.`);
                addTicketEvent(ticket, `${CURRENT_TECH} assumiu o chamado`, 'user-round-check', CURRENT_TECH);
                return true;
            } catch (error) {
                showToast(error.message || 'Nao foi possivel assumir o chamado.', 'warning');
                return false;
            }
        }
        const result = await updateStatus(ticketId, nextStatus, reason);
        return Boolean(result);
    }

    function initKanbanBoard() {
        const board = document.querySelector('[data-kanban-board]');
        if (!board) return;
        let draggingId = null;

        board.querySelectorAll('.kanban-card').forEach((card) => {
            card.addEventListener('dragstart', (event) => {
                draggingId = card.dataset.ticket;
                card.classList.add('is-dragging');
                event.dataTransfer.effectAllowed = 'move';
                event.dataTransfer.setData('text/plain', draggingId);
            });
            card.addEventListener('dragend', () => {
                card.classList.remove('is-dragging');
                board.querySelectorAll('.nw-kanban-column').forEach((column) => column.classList.remove('is-drop-target', 'is-drop-blocked'));
                draggingId = null;
            });
        });

        board.querySelectorAll('.nw-kanban-column').forEach((column) => {
            column.addEventListener('dragover', (event) => {
                if (!draggingId) return;
                const ticket = getTicket(draggingId);
                const target = column.dataset.kanbanStatus;
                if (!ticket || ticket.status === target) return;
                event.preventDefault();
                const allowed = (STATUS_TRANSITIONS[ticket.status] || []).includes(target);
                column.classList.toggle('is-drop-target', allowed);
                column.classList.toggle('is-drop-blocked', !allowed);
            });
            column.addEventListener('dragleave', () => column.classList.remove('is-drop-target', 'is-drop-blocked'));
            column.addEventListener('drop', (event) => {
                event.preventDefault();
                const ticketId = event.dataTransfer.getData('text/plain') || draggingId;
                const ticket = getTicket(ticketId);
                const nextStatus = column.dataset.kanbanStatus;
                column.classList.remove('is-drop-target', 'is-drop-blocked');
                if (!ticket || ticket.status === nextStatus) return;
                const run = (reason = '') => moveKanbanTicket(ticketId, nextStatus, reason);
                if (needsKanbanReason(ticket, nextStatus)) openKanbanTransitionDialog(ticket, nextStatus, run);
                else run();
            });
        });

        updateKanbanCounts();
    }

    async function submitQuickComment(form) {
        const ticket = getTicket(selectedTicketId);
        const textarea = form?.querySelector('textarea');
        const body = textarea?.value.trim();
        if (!ticket || !body) return;
        const internal = form.querySelector('[name="internal"]')?.checked !== false;
        try {
            const data = await postTicketJson(ticket.number, 'comments', {
                body,
                visibility: internal ? 'internal' : 'public',
            });
            ticket.comments = ticket.comments || [];
            ticket.comments.unshift({
                author: data.comment?.author || CURRENT_TECH,
                when: data.comment?.when || 'agora',
                visibility: data.comment?.visibilityLabel || (internal ? 'Interno' : 'Publico'),
                body: data.comment?.body || body,
            });
            ticket.updated_for = 'agora';
            addTicketEvent(ticket, `Comentario ${internal ? 'interno' : 'publico'} adicionado`, 'message-square');
            updateRowFromTicket(ticket.number);
            textarea.value = '';
            renderPreview(ticket);
            showToast('Comentario adicionado.', 'success');
        } catch (error) {
            showToast(error.message || 'Nao foi possivel adicionar comentario.', 'warning');
        }
    }

    async function uploadPreviewAttachments(input) {
        const ticket = getTicket(selectedTicketId);
        const files = Array.from(input?.files || []);
        if (!ticket || !files.length) return;
        const form = input.closest('[data-comment-form]');
        const internal = form?.querySelector('[name="internal"]')?.checked !== false;
        const data = new FormData();
        files.forEach((file) => data.append('attachments', file));
        data.append('visibility', internal ? 'internal' : 'public');
        try {
            const response = await postTicketForm(ticket.number, 'attachments', data);
            ticket.attachments = [...(response.attachments || []), ...(ticket.attachments || [])];
            ticket.attachments_count = response.attachmentsCount ?? ticket.attachments.length;
            ticket.updated_for = 'agora';
            addTicketEvent(ticket, `${files.length} anexo${files.length === 1 ? '' : 's'} adicionado${files.length === 1 ? '' : 's'}`, 'paperclip');
            updateRowFromTicket(ticket.number);
            renderPreview(ticket);
            showToast('Anexo enviado ao chamado.', 'success');
        } catch (error) {
            showToast(error.message || 'Nao foi possivel anexar arquivo.', 'warning');
        } finally {
            input.value = '';
        }
    }

    function initFilterbar() {
        const filterbar = document.querySelector('[data-filterbar]');
        if (!filterbar) return;
        const filters = Array.from(filterbar.querySelectorAll('.nw-filter'));
        const quickViews = Array.from(filterbar.querySelectorAll('[data-quick-view]'));
        const globalClear = filterbar.querySelector('[data-filter-global-clear]');
        const resultCount = filterbar.querySelector('[data-filter-result-count]');
        const appliedChips = filterbar.querySelector('[data-filter-applied-chips]');
        const tableBody = document.querySelector('.desk-ticket-grid-body');
        let empty = tableBody?.querySelector('.desk-ticket-empty.is-client-filter-empty');
        if (tableBody && !empty) {
            empty = document.createElement('div');
            empty.className = 'desk-empty compact desk-ticket-empty is-client-filter-empty';
            empty.hidden = true;
            empty.innerHTML = '<i data-lucide="search-x"></i><span><strong>Nenhum chamado encontrado com os filtros atuais.</strong><small>Ajuste os filtros ou limpe a busca para ver mais resultados.</small></span>';
            tableBody.appendChild(empty);
        }
        const defaults = new Map(filters.map((filter) => [filter, filter.querySelector('[data-filter-summary]')?.textContent?.trim() || 'Filtro']));
        const viewPresets = {
            'Fila geral': {},
            'Atribuídos a mim': { technician: ['__me__'] },
            'Minha fila': { technician: ['__me__'] },
            'Meus chamados': { technician: ['__me__'] },
            'Sem responsável': { flag: ['unassigned'] },
            'Críticos': { priority: ['critical'] },
            'Criticos sem dono': { priority: ['critical'], flag: ['unassigned'] },
            'Críticos sem dono': { priority: ['critical'], flag: ['unassigned'] },
            'SLA vencendo': { sla: ['warning', 'critical'] },
            'RMM': { origin: ['rmm'] },
            'RMM Alertas': { origin: ['rmm'] },
            'Sem responsavel': { flag: ['unassigned'] },
            'Reabertos': { flag: ['reopened'] },
            'Aguardando usuario': { status: ['waiting_user'] },
            'Financeiro': { sector: ['Financeiro'] },
            'Diretoria': { sector: ['Diretoria'] }
        };

        function closeFilters(except = null) {
            filters.forEach((filter) => {
                if (filter !== except) {
                    filter.classList.remove('is-open', 'is-align-end', 'is-drop-up');
                    filter.querySelector('[data-filter-trigger]')?.setAttribute('aria-expanded', 'false');
                }
            });
        }

        function selectedByField() {
            const data = {};
            filterbar.querySelectorAll('[data-filter-input]:checked').forEach((input) => {
                const field = input.dataset.field;
                if (!data[field]) data[field] = [];
                data[field].push(input.value);
            });
            return data;
        }

        function matches(row, field, values) {
            if (!values?.length) return true;
            if (field === 'flag') return values.some((value) => row.dataset[value] === '1');
            if (field === 'rmm') return values.some((value) => row.dataset[`rmm${value.charAt(0).toUpperCase()}${value.slice(1)}`] === '1');
            if (field === 'stale') return row.dataset.stale === '1';
            if (field === 'technician') {
                if (values.includes('__all__')) return true;
                const normalized = values.map((value) => value === '__me__' ? CURRENT_TECH : value === '__unassigned__' ? 'Sem responsavel' : value);
                return normalized.includes(row.dataset.technician || '');
            }
            return values.includes(row.dataset[field] || '');
        }

        function markQuickView(name) {
            const aliases = { 'Minha fila': 'Atribuídos a mim', 'Meus chamados': 'Atribuídos a mim', 'RMM Alertas': 'RMM' };
            const activeName = aliases[name] || name;
            quickViews.forEach((button) => button.classList.toggle('is-active', button.dataset.quickView === activeName));
        }

        function updateFilterChips(active) {
            let total = 0;
            const applied = [];
            const fieldLabels = {
                status: 'Status',
                priority: 'Prioridade',
                technician: 'Tecnico',
                client: 'Cliente',
                sector: 'Setor',
                category: 'Categoria',
                origin: 'Origem',
                queue: 'Fila',
                sla: 'SLA',
                stale: 'Tempo',
                flag: 'Caracteristica',
                rmm: 'RMM'
            };
            filters.forEach((filter) => {
                const summary = filter.querySelector('[data-filter-summary]');
                const selected = Array.from(filter.querySelectorAll('[data-filter-input]:checked'));
                const count = selected.length;
                total += count;
                filter.classList.toggle('is-active', count > 0);
                filter.querySelector('[data-filter-selected]')?.replaceChildren(document.createTextNode(`${count} selecionado${count === 1 ? '' : 's'}`));
                if (!summary) return;
                if (filter.dataset.filter === 'view') return;
                if (count === 0) summary.textContent = defaults.get(filter);
                else if (filter.dataset.filter === 'advanced') summary.textContent = `Mais filtros: ${count}`;
                else {
                    const label = selected[0].closest('[data-filter-option]')?.querySelector('.nw-filter-option__label')?.childNodes[0]?.textContent?.trim() || selected[0].value;
                    summary.textContent = count === 1 ? `${defaults.get(filter)}: ${label}` : `${defaults.get(filter)}: ${label} +${count - 1}`;
                }
                selected.forEach((input) => {
                    const label = input.closest('[data-filter-option]')?.querySelector('.nw-filter-option__label')?.childNodes[0]?.textContent?.trim() || input.value;
                    applied.push({ field: fieldLabels[input.dataset.field] || 'Filtro', label });
                });
            });
            if (appliedChips) {
                appliedChips.hidden = applied.length === 0;
                appliedChips.innerHTML = applied.map((chip) => `<span class="nw-applied-filter-chip">${escapeHtml(chip.field)}: <strong>${escapeHtml(chip.label)}</strong></span>`).join('');
            }
            if (globalClear) {
                globalClear.disabled = total === 0;
                globalClear.hidden = total === 0;
                globalClear.classList.toggle('is-active', total > 0);
                globalClear.querySelector('span').textContent = total ? `Limpar ${total}` : 'Limpar';
            }
        }

        function updateFilterUrl(active) {
            const params = new URLSearchParams();
            params.set('view', '{{ view_mode }}');
            Object.entries(active).forEach(([field, values]) => values.length && params.set(field, values.join(',')));
            window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
        }

        function applyFilters(message) {
            const active = selectedByField();
            const fields = Object.keys(active);
            let visible = 0;
            rows().forEach((row) => {
                const show = fields.every((field) => matches(row, field, active[field]));
                row.hidden = !show;
                if (show) visible += 1;
            });
            if (empty) empty.hidden = visible !== 0;
            if (resultCount) resultCount.textContent = `${visible} de ${rows().length} chamados`;
            updateKanbanCounts();
            updateFilterChips(active);
            updateFilterUrl(active);
            refreshSelection();
            if (selectedTicketId && getRow(selectedTicketId)?.hidden) clearPreviewSelection();
            else if (focusedTicketId && getRow(focusedTicketId)?.hidden) focusTicketRow(null, { select: false });
            if (message) showToast(message, 'info');
            window.lucide?.createIcons?.();
        }

        function setPreset(name) {
            filterbar.querySelectorAll('[data-filter-input]').forEach((input) => { input.checked = false; });
            const preset = viewPresets[name] || {};
            Object.entries(preset).forEach(([field, values]) => {
                values.forEach((value) => {
                    const input = filterbar.querySelector(`[data-filter-input][data-field="${field}"][value="${CSS.escape(value)}"]`);
                    if (input) input.checked = true;
                });
            });
            filterbar.querySelector('[data-filter="view"] [data-filter-summary]').textContent = name;
            markQuickView(name);
            closeFilters();
            applyFilters(`View "${name}" aplicada.`);
        }

        function filterSearch(popover, term) {
            const options = Array.from(popover.querySelectorAll('[data-filter-option]'));
            let shown = 0;
            options.forEach((option) => {
                const hit = option.textContent.toLowerCase().includes(term.toLowerCase());
                option.hidden = !hit;
                if (hit) shown += 1;
            });
            const emptyState = popover.querySelector('[data-filter-empty]');
            if (emptyState) emptyState.hidden = shown !== 0;
        }

        filters.forEach((filter) => {
            const trigger = filter.querySelector('[data-filter-trigger]');
            const popover = filter.querySelector('[data-filter-popover]');
            trigger?.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopPropagation();
                const shouldOpen = !filter.classList.contains('is-open');
                closeFilters();
                filter.classList.toggle('is-open', shouldOpen);
                trigger.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
                if (shouldOpen && popover) {
                    window.setTimeout(() => {
                        const rect = popover.getBoundingClientRect();
                        filter.classList.toggle('is-align-end', rect.right > window.innerWidth - 16);
                        filter.classList.toggle('is-drop-up', rect.bottom > window.innerHeight - 16);
                        popover.querySelector('[data-filter-search]')?.focus();
                    }, 0);
                }
            });
            popover?.addEventListener('click', (event) => event.stopPropagation());
            popover?.querySelector('[data-filter-close]')?.addEventListener('click', () => closeFilters());
            popover?.querySelector('[data-filter-search]')?.addEventListener('input', (event) => filterSearch(popover, event.target.value));
            popover?.querySelector('[data-filter-apply]')?.addEventListener('click', () => { markQuickView(''); closeFilters(); applyFilters('Filtros aplicados.'); });
            popover?.querySelector('[data-filter-clear]')?.addEventListener('click', () => {
                popover.querySelectorAll('[data-filter-input]').forEach((input) => { input.checked = false; });
                markQuickView('');
                closeFilters();
                applyFilters('Filtro limpo.');
            });
            popover?.querySelectorAll('.nw-filter-view-option').forEach((view) => {
                view.addEventListener('click', (event) => {
                    event.preventDefault();
                    setPreset(view.textContent.trim());
                });
            });
        });
        quickViews.forEach((button) => button.addEventListener('click', () => setPreset(button.dataset.quickView)));
        globalClear?.addEventListener('click', () => {
            filterbar.querySelectorAll('[data-filter-input]').forEach((input) => { input.checked = false; });
            filterbar.querySelector('[data-filter="view"] [data-filter-summary]').textContent = 'Fila geral';
            markQuickView('Fila geral');
            closeFilters();
            applyFilters('Filtros limpos.');
        });
        document.addEventListener('click', () => closeFilters());
        document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeFilters(); });
        applyFilters();
        window.nwApplySavedView = setPreset;
        window.nwRefreshCentralFilters = () => applyFilters();
    }

    function commandItems(query = '') {
        const q = query.trim().toLowerCase();
        const tickets = ticketData.filter((ticket) => {
            const haystack = `${ticket.number} ${ticket.title} ${ticket.requester} ${ticket.category} ${ticket.status_label} ${ticket.endpoint?.hostname || ''}`.toLowerCase();
            return !q || haystack.includes(q.replace(/^#/, ''));
        }).slice(0, 8).map((ticket) => ({ group: 'Chamados', icon: 'ticket', label: `#${ticket.number} ${ticket.title}`, meta: `${ticket.status_label} · ${ticket.priority_label}`, action: () => selectTicketForPreview(ticket.number), secondary: () => openTicketDrawer(ticket.number) }));
        const endpoints = ticketData.filter((ticket) => ticket.endpoint && (!q || ticket.endpoint.hostname.toLowerCase().includes(q))).slice(0, 5).map((ticket) => ({ group: 'Endpoints', icon: 'monitor', label: ticket.endpoint.hostname, meta: `${ticket.endpoint.status} · ${ticket.rmm?.active_alerts || 0} alertas`, action: () => { selectTicketForPreview(ticket.number); showToast('Endpoint selecionado no preview.', 'info'); } }));
        const views = ['Fila geral', 'Atribuídos a mim', 'Críticos', 'SLA vencendo', 'RMM', 'Sem responsável', 'Aguardando usuario', 'Financeiro'].filter((name) => !q || name.toLowerCase().includes(q)).map((name) => ({ group: 'Views', icon: 'list-filter', label: name, meta: 'Aplicar view salva', action: () => window.nwApplySavedView?.(name) }));
        const actions = [
            { label: 'Novo chamado', icon: 'plus', meta: 'Ctrl+N', action: () => { window.location.href = createUrl; } },
            { label: 'Ver atalhos', icon: 'keyboard', meta: '?', action: () => { shortcuts.hidden = false; } },
            { label: 'Alternar Kanban', icon: 'columns-3', meta: 'View', action: () => { window.location.href = `${centralUrl}?view=kanban`; } },
            { label: 'Filtrar por criticos', icon: 'alert-triangle', meta: 'Prioridade', action: () => window.nwApplySavedView?.('Criticos sem dono') },
            { label: 'Limpar filtros', icon: 'x-circle', meta: 'Reset', action: () => document.querySelector('[data-filter-global-clear]')?.click() },
        ].filter((item) => !q || item.label.toLowerCase().includes(q)).map((item) => ({ ...item, group: 'Acoes' }));
        return [...tickets, ...endpoints, ...views, ...actions];
    }

    function renderCommandResults(query) {
        const container = command?.querySelector('.desk-command-groups');
        if (!container) return;
        const items = commandItems(query);
        commandIndex = Math.min(commandIndex, Math.max(0, items.length - 1));
        if (!items.length) {
            container.innerHTML = '<section class="nw-command-empty"><i data-lucide="search-x"></i><strong>Nenhum resultado encontrado</strong></section>';
            window.lucide?.createIcons?.();
            return;
        }
        const groups = [...new Set(items.map((item) => item.group))];
        container.innerHTML = groups.map((group) => `
            <section>
                <strong>${escapeHtml(group)}</strong>
                ${items.filter((item) => item.group === group).map((item, index) => {
                    const globalIndex = items.indexOf(item);
                    return `<button type="button" data-command-item="${globalIndex}" class="${globalIndex === commandIndex ? 'is-active' : ''}"><i data-lucide="${item.icon}"></i><span>${escapeHtml(item.label)}<small>${escapeHtml(item.meta || '')}</small></span>${globalIndex === commandIndex ? '<kbd>Enter</kbd>' : ''}</button>`;
                }).join('')}
            </section>
        `).join('');
        container.querySelectorAll('[data-command-item]').forEach((button) => {
            button.addEventListener('click', () => {
                const item = items[Number(button.dataset.commandItem)];
                closeCommandPalette();
                item?.action?.();
            });
        });
        command._items = items;
        window.lucide?.createIcons?.();
    }

    function initEvents() {
        checks().forEach((check, index) => {
            check.addEventListener('click', (event) => event.stopPropagation());
            check.addEventListener('change', (event) => {
                if (event.shiftKey && lastCheckedIndex !== null) {
                    const all = checks();
                    const [start, end] = [lastCheckedIndex, index].sort((a, b) => a - b);
                    all.slice(start, end + 1).forEach((item) => { if (!item.closest(rowSelector).hidden) item.checked = check.checked; });
                }
                lastCheckedIndex = index;
                refreshSelection();
            });
        });
        checkAll?.addEventListener('change', () => {
            getVisibleTicketRows().forEach((row) => {
                const checkbox = row.querySelector('.desk-row-checkbox');
                if (checkbox) checkbox.checked = checkAll.checked;
            });
            refreshSelection();
        });
        document.querySelector('[data-clear-selection]')?.addEventListener('click', () => {
            checks().forEach((check) => { check.checked = false; });
            refreshSelection();
        });
        rows().forEach((row) => {
            row.addEventListener('click', (event) => {
                if (event.target.closest('a, input, summary, details, label')) return;
                if (event.target.closest('button') && !event.target.closest('[data-preview-trigger]')) return;
                selectTicketForPreview(row.dataset.ticket);
            });
            row.addEventListener('dblclick', () => openTicketDrawer(row.dataset.ticket));
            row.addEventListener('focus', () => focusTicketRow(row.dataset.ticket, { scroll: false, domFocus: false }));
        });
        listPane?.addEventListener('contextmenu', (event) => {
            const row = event.target.closest(rowSelector);
            if (!row || !listPane.contains(row)) return;
            event.preventDefault();
            event.stopPropagation();
            showContextMenu(event, row.dataset.ticket);
        });
        listPane?.addEventListener('click', (event) => {
            const actionButton = event.target.closest('[data-row-action]');
            if (!actionButton || !listPane.contains(actionButton)) return;
            const row = actionButton.closest(rowSelector);
            if (!row) return;
            const action = actionButton.dataset.rowAction;
            if (action === 'open') return;
            event.preventDefault();
            event.stopPropagation();
            if (action === 'copy') copyTicketLink(row.dataset.ticket);
            if (action === 'more') showContextMenu(event, row.dataset.ticket);
        });
        selectionBar?.querySelectorAll('button').forEach((button) => {
            const label = button.textContent.trim().toLowerCase();
            if (label.includes('atribuir')) button.addEventListener('click', () => { selectedTickets().forEach((ticket) => setAssignee(ticket.number)); });
            if (label.includes('prioridade')) button.addEventListener('click', () => { selectedTickets().forEach((ticket) => cyclePriority(ticket.number)); });
            if (label.includes('status')) button.addEventListener('click', () => openBulkConfirm('Mudar status'));
            if (label.includes('escalar') || label.includes('fechar')) button.addEventListener('click', () => openBulkConfirm(label));
            if (label.includes('mesclar')) button.addEventListener('click', openMergeDialog);
        });
        previewPanel?.addEventListener('click', (event) => {
            if (event.target.closest('[data-preview-clear]')) {
                event.preventDefault();
                clearPreviewSelection();
                return;
            }
            if (event.target.closest('[data-preview-hide]')) {
                event.preventDefault();
                setPreviewClosed(true);
                return;
            }
            const related = event.target.closest('[data-related-ticket]');
            if (related) {
                selectTicketForPreview(related.dataset.relatedTicket);
                return;
            }
            if (event.target.closest('[data-mock-macro]')) {
                openMacroMenu(event.target.closest('[data-mock-macro]'));
                return;
            }
            if (event.target.closest('[data-preview-attach]')) {
                event.target.closest('[data-comment-form]')?.querySelector('[data-preview-attachment-input]')?.click();
                return;
            }
            const action = event.target.closest('[data-preview-action]')?.dataset.previewAction;
            if (!action || !selectedTicketId) return;
            if (action === 'assign') setAssignee(selectedTicketId);
            if (action === 'copy') copyTicketLink(selectedTicketId);
            if (action === 'drawer') openTicketDrawer(selectedTicketId);
            if (action === 'more') showContextMenu(event, selectedTicketId);
            if (action === 'status') openStatusMenu(selectedTicketId, event.target.closest('[data-preview-action]'));
            if (action === 'priority') openPriorityMenu(selectedTicketId, event.target.closest('[data-preview-action]'));
            if (action === 'comment') previewPanel.querySelector('.desk-comment-dock textarea')?.focus();
            if (action === 'open-rmm' || action === 'rmm') {
                const ticket = getTicket(selectedTicketId);
                if (ticket?.endpoint) {
                    showToast('Abrindo inventario de endpoints. Contexto RMM detalhado ainda sera conectado.', 'info');
                    window.location.href = endpointUrl;
                } else {
                    showToast('Este chamado nao possui endpoint vinculado.', 'warning');
                }
            }
            if (action === 'remote') showToast('Acesso remoto ainda nao esta implementado nesta fase.', 'warning');
            if (action === 'device') {
                const ticket = getTicket(selectedTicketId);
                if (ticket?.endpoint) window.location.href = endpointUrl;
                else showToast('Este chamado nao possui endpoint vinculado.', 'warning');
            }
            if (action === 'link-device') showToast('Vinculo de endpoint ainda nao esta conectado nesta tela.', 'info');
            if (action === 'escalate') openBulkConfirm('Escalar', [getTicket(selectedTicketId)]);
            if (action === 'reminder') showToast('Lembrete ao solicitante preparado.', 'success');
            if (action === 'related') openTicketDrawer(selectedTicketId);
            if (action === 'merge-related') {
                const ticket = getTicket(selectedTicketId);
                [selectedTicketId, ...(ticket?.relatedTicketIds || [])].forEach((id) => {
                    const checkbox = getRow(id)?.querySelector('.desk-row-checkbox');
                    if (checkbox) checkbox.checked = true;
                });
                refreshSelection();
                openMergeDialog();
            }
        });
        previewPanel?.addEventListener('submit', (event) => {
            if (event.target.matches('[data-comment-form]')) {
                event.preventDefault();
                submitQuickComment(event.target);
            }
        });
        previewPanel?.addEventListener('change', (event) => {
            if (event.target.name === 'internal') {
                previewPanel.querySelector('[data-public-warning]').hidden = event.target.checked;
            }
            if (event.target.matches('[data-preview-attachment-input]')) {
                uploadPreviewAttachments(event.target);
            }
        });
        previewPanel?.addEventListener('keydown', (event) => {
            if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
                event.preventDefault();
                submitQuickComment(event.target.closest('[data-comment-form]'));
            }
        });
        command?.querySelector('input')?.addEventListener('input', (event) => { commandIndex = 0; renderCommandResults(event.target.value); });
        document.querySelectorAll('[data-command-open]').forEach((button) => button.addEventListener('click', openCommandPalette));
        document.querySelectorAll('[data-close-overlay]').forEach((button) => button.addEventListener('click', () => {
            if (button.closest('[data-command-palette]')) closeCommandPalette();
            else button.closest('[data-shortcuts-dialog]')?.setAttribute('hidden', '');
        }));
        command?.addEventListener('click', (event) => { if (event.target.classList.contains('desk-command-palette')) closeCommandPalette(); });
        command?.addEventListener('wheel', (event) => {
            if (!event.target.closest('.desk-command-groups')) event.preventDefault();
        }, { passive: false });
        shortcuts?.addEventListener('click', (event) => { if (event.target.classList.contains('desk-shortcuts-overlay')) shortcuts.hidden = true; });
        toast?.querySelector('button')?.addEventListener('click', () => {
            const undo = toastUndo;
            toastUndo = null;
            toast.hidden = true;
            undo?.();
        });
        contextMenu?.addEventListener('click', (event) => {
            const action = event.target.closest('[data-context-action]')?.dataset.contextAction;
            if (!action || !pendingContextTicketId) return;
            event.preventDefault();
            hideContextMenu();
            if (action === 'preview') selectTicketForPreview(pendingContextTicketId);
            if (action === 'drawer') openTicketDrawer(pendingContextTicketId);
            if (action === 'copy') copyTicketLink(pendingContextTicketId);
            if (action === 'assign') setAssignee(pendingContextTicketId);
            if (action === 'status') cycleStatus(pendingContextTicketId);
            if (action === 'priority' || action === 'critical') cyclePriority(pendingContextTicketId);
            if (action === 'endpoint') window.location.href = endpointUrl;
            if (action === 'rmm') showToast('Abrindo no RMM mockado.', 'info');
            if (action === 'merge') { getRow(pendingContextTicketId)?.querySelector('.desk-row-checkbox')?.click(); openMergeDialog(); }
        });
        document.addEventListener('click', (event) => {
            if (!event.target.closest('[data-ticket-context-menu]')) hideContextMenu();
            if (!event.target.closest('.nw-preview-action-menu') && !event.target.closest('[data-preview-action]') && !event.target.closest('[data-mock-macro]')) closeActionMenus();
        });
        document.querySelectorAll('[data-quick-ticket-open]').forEach((button) => button.addEventListener('click', (event) => {
            event.preventDefault();
            openQuickTicketDrawer();
        }));
        quickTicketDrawer?.querySelectorAll('[data-quick-paste-hint]').forEach((button) => {
            button.addEventListener('click', handleQuickPasteButton);
        });
        quickTicketDrawer?.querySelectorAll('[data-quick-ticket-close]').forEach((button) => button.addEventListener('click', closeQuickTicketDrawer));
        quickTicketDrawer?.addEventListener('click', (event) => {
            if (event.target.matches('[data-quick-ticket-drawer], [data-quick-ticket-close]')) closeQuickTicketDrawer();
            const requester = event.target.closest('[data-quick-pick-requester]');
            if (requester) pickQuickRequester(requester.dataset.quickPickRequester);
            const endpoint = event.target.closest('[data-quick-pick-endpoint]');
            if (endpoint) pickQuickEndpoint(endpoint.dataset.quickPickEndpoint);
            const template = event.target.closest('[data-quick-template]');
            if (template) applyQuickTemplate(template.dataset.quickTemplate);
            const create = event.target.closest('[data-quick-create]');
            if (create) createQuickTicket(create.dataset.quickCreate);
            if (event.target.closest('[data-quick-save-draft]')) saveQuickDraft(false);
            if (event.target.closest('[data-quick-discard-draft]')) clearQuickDraft();
            if (event.target.closest('[data-quick-open-requester-create]')) openQuickRequesterCreate();
            if (event.target.closest('[data-quick-requester-create-close]')) closeQuickRequesterCreate();
            if (event.target.closest('[data-quick-requester-create-save]')) saveQuickRequesterCreate();
            if (event.target.closest('[data-quick-file-pick]')) quickTicketDrawer.querySelector('[data-quick-file-input]')?.click();
            if (event.target.closest('[data-quick-paste-hint]')) handleQuickPasteButton(event);
            if (event.target.closest('[data-quick-remove-attachment]')) event.target.closest('span')?.remove();
            const related = event.target.closest('[data-quick-link-related]');
            if (related) linkQuickRelated(related.dataset.quickLinkRelated);
            const unlinkRelated = event.target.closest('[data-quick-unlink-related]');
            if (unlinkRelated) unlinkQuickRelated(unlinkRelated.dataset.quickUnlinkRelated);
            const endpointAction = event.target.closest('[data-quick-endpoint-action]');
            if (endpointAction) {
                if (endpointAction.dataset.quickEndpointAction === 'clear') {
                    selectedQuickEndpoint = null;
                    setQuickValue('endpoint', '');
                    quickTicketDrawer.querySelector('[data-quick-endpoint-card]').hidden = true;
                    updateQuickRelated();
                    saveQuickDraft(true);
                } else if (endpointAction.dataset.quickEndpointAction === 'sync') {
                    showToast('Endpoint sincronizado no mock.', 'success');
                } else {
                    showToast('Abrindo endpoint no RMM.', 'info');
                }
            }
        });
        quickTicketDrawer?.addEventListener('input', (event) => {
            const requesterSearch = event.target.closest('[data-quick-requester-search]');
            if (requesterSearch) {
                const query = requesterSearch.value.trim().toLowerCase();
                const rows = QUICK_REQUESTERS.filter((item) => [item.name, item.email, item.sector].join(' ').toLowerCase().includes(query)).slice(0, 5);
                renderQuickResults(quickTicketDrawer.querySelector('[data-quick-requester-results]'), query ? rows : [], (item) => `
                    <button type="button" data-quick-pick-requester="${escapeHtml(item.name)}">
                        <strong>${escapeHtml(item.name)}${item.vip ? ' · VIP' : ''}</strong>
                        <span>${escapeHtml(item.email)} · ${escapeHtml(item.sector)}</span>
                    </button>
                `, 'Nenhum solicitante encontrado. <button type="button" data-quick-open-requester-create>Criar solicitante rápido</button>');
            }
            const endpointSearch = event.target.closest('[data-quick-endpoint-search]');
            if (endpointSearch) {
                const query = endpointSearch.value.trim().toLowerCase();
                const rows = QUICK_ENDPOINTS.filter((item) => [item.hostname, item.user, item.ip].join(' ').toLowerCase().includes(query)).slice(0, 5);
                renderQuickResults(quickTicketDrawer.querySelector('[data-quick-endpoint-results]'), query ? rows : [], (item) => `
                    <button type="button" data-quick-pick-endpoint="${escapeHtml(item.hostname)}">
                        <strong>${escapeHtml(item.hostname)} · ${escapeHtml(item.label)}</strong>
                        <span>${escapeHtml(item.user)} · ${escapeHtml(item.ip)} · ${escapeHtml(item.alerts)}</span>
                    </button>
                `, 'Nenhum endpoint encontrado.');
            }
            if (event.target.closest('[data-quick-title], [data-quick-category], [data-quick-requester-search], [data-quick-endpoint-search], [data-quick-related-search]')) updateQuickRelated();
            saveQuickDraft(true);
        });
        quickTicketDrawer?.addEventListener('change', (event) => {
            if (event.target.matches('[data-quick-category]')) {
                applyQuickCategoryDefaults();
                updateQuickRelated();
            }
            if (event.target.matches('[data-quick-priority], [data-quick-category]')) updateQuickCritical();
            if (event.target.matches('[data-quick-file-input]')) {
                Array.from(event.target.files || []).forEach((file) => addQuickAttachment(file.name));
                event.target.value = '';
                showToast('Arquivo anexado ao rascunho.', 'success');
            }
            saveQuickDraft(true);
        });
        document.addEventListener('paste', (event) => {
            if (!quickTicketDrawer || quickTicketDrawer.hidden) return;
            const imageItem = Array.from(event.clipboardData?.items || []).find((item) => item.type.startsWith('image/'));
            if (!imageItem) return;
            const file = imageItem.getAsFile();
            const signature = file ? `${file.type}:${file.size}` : '';
            const added = addQuickAttachment(quickPrintAttachmentName(), signature);
            if (signature) lastQuickClipboardImageSignature = signature;
            showToast(added ? 'Print colado como anexo.' : 'Print já está nos anexos.', added ? 'success' : 'info');
        });
        drawer?.querySelector('[data-drawer-close]')?.addEventListener('click', closeDrawer);
        drawer?.addEventListener('click', (event) => { if (event.target === drawer) closeDrawer(); });
        bulkDialog?.querySelector('[data-bulk-dialog-close]')?.addEventListener('click', () => bulkDialog.close());
        bulkDialog?.querySelector('[data-bulk-confirm-accept]')?.addEventListener('click', () => showToast('Acao em lote aplicada.', 'success'));
        mergeDialog?.querySelector('[data-merge-close]')?.addEventListener('click', () => mergeDialog.close());
        mergeDialog?.querySelector('[data-merge-accept]')?.addEventListener('click', () => {
            const primary = mergeDialog.querySelector('[name="merge-primary"]:checked')?.value;
            selectedTickets().forEach((ticket) => { if (String(ticket.number) !== primary) { ticket.isMerged = true; getRow(ticket.number)?.classList.add('is-merged'); } });
            showToast(`Chamados mesclados com #${primary}.`, 'success');
        });
        document.querySelector('[data-load-new]')?.addEventListener('click', (event) => {
            event.preventDefault();
            document.querySelector('[data-realtime-pill]')?.setAttribute('hidden', '');
            getVisibleTicketRows().slice(0, 3).forEach((row, index) => setTimeout(() => {
                row.classList.add('is-live-updated');
                setTimeout(() => row.classList.remove('is-live-updated'), 3200);
            }, index * 160));
            showToast('3 novos chamados carregados.', 'success');
        });
    }

    function handleGlobalShortcuts(event) {
        const activeTag = document.activeElement?.tagName;
        const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeTag);
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
            event.preventDefault();
            openCommandPalette();
            return;
        }
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'n') {
            event.preventDefault();
            openQuickTicketDrawer();
            return;
        }
        if (event.key === 'Escape') {
            closeFloatingUi();
            rows().forEach((row) => row.classList.remove('is-key-focused'));
            return;
        }
        if (!command?.hidden) {
            const items = command._items || [];
            if (event.key === 'ArrowDown') { event.preventDefault(); commandIndex = Math.min(items.length - 1, commandIndex + 1); renderCommandResults(command.querySelector('input').value); }
            if (event.key === 'ArrowUp') { event.preventDefault(); commandIndex = Math.max(0, commandIndex - 1); renderCommandResults(command.querySelector('input').value); }
            if (event.key === 'Enter') { event.preventDefault(); closeCommandPalette(); items[commandIndex]?.action?.(); }
            return;
        }
        if (typing) return;
        if (event.key === '?') {
            event.preventDefault();
            shortcuts.hidden = false;
        } else if (event.key.toLowerCase() === 'j') {
            event.preventDefault();
            moveTicketFocus(1);
        } else if (event.key.toLowerCase() === 'k') {
            event.preventDefault();
            moveTicketFocus(-1);
        } else if (event.key === 'Enter') {
            event.preventDefault();
            openFocusedTicket();
        } else if (event.key === ' ') {
            event.preventDefault();
            toggleFocusedTicketCheckbox();
        } else if (event.key.toLowerCase() === 'a' && focusedTicketId) {
            setAssignee(focusedTicketId);
        } else if (event.key.toLowerCase() === 's' && focusedTicketId) {
            openStatusMenu(focusedTicketId, getRow(focusedTicketId));
        } else if (event.key.toLowerCase() === 'p' && focusedTicketId) {
            openPriorityMenu(focusedTicketId, getRow(focusedTicketId));
        } else if (event.key.toLowerCase() === 'c') {
            previewPanel?.querySelector('.desk-comment-dock textarea')?.focus();
        }
    }

    document.addEventListener('keydown', handleGlobalShortcuts);
    initFilterbar();
    initPreviewToggle();
    initEvents();
    initKanbanBoard();
    refreshSelection();
    if (focusedTicketId) {
        focusTicketRow(focusedTicketId, { scroll: false, select: false });
        selectTicketForPreview(focusedTicketId);
    }
    setTimeout(() => {
        const liveRow = rows().find((row) => row.classList.contains('is-rmm')) || rows()[0];
        liveRow?.classList.add('is-live-updated');
        setTimeout(() => liveRow?.classList.remove('is-live-updated'), 4200);
        if (liveRow) showToast(`Renan assumiu o chamado #${liveRow.dataset.ticket}.`, 'info');
    }, 1800);
})();
</script>
