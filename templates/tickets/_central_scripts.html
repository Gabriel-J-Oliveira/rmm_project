<script>
(() => {
    const CURRENT_TECH = '{{ current_user_name|default:"Técnico"|escapejs }}';
    const centralUrl = "{% url 'tickets:central' %}";
    const createUrl = "{% url 'tickets:create' %}";
    const createTicketApiUrl = "{% url 'tickets:api-create' %}";
    const endpointUrl = "{% url 'endpoint-list' %}";
    const rowSelector = '.desk-ticket-row, .kanban-card';
    const listPane = document.querySelector('.desk-central-list-pane');
    const centralWorkspace = document.querySelector('[data-central-workspace]');
    const previewPanel = document.querySelector('[data-preview-panel]');
    const previewOpenButton = document.querySelector('[data-preview-open]');
    const selectionBar = document.querySelector('.desk-selection-bar');
    const selectedLabel = document.querySelector('[data-selected-label]');
    const checkAll = document.querySelector('.desk-row-check-all');
    const command = document.querySelector('[data-command-palette]');
    const shortcuts = document.querySelector('[data-shortcuts-dialog]');
    const toast = document.querySelector('[data-toast]');
    const contextMenu = document.querySelector('[data-ticket-context-menu]');
    const drawer = document.querySelector('[data-ticket-drawer]');
    const drawerBody = document.querySelector('[data-drawer-body]');
    const quickTicketDrawer = document.querySelector('[data-quick-ticket-drawer]');
    const quickTicketForm = document.querySelector('[data-quick-ticket-form]');
    const mergeDialog = document.querySelector('[data-merge-dialog]');
    const bulkDialog = document.querySelector('[data-bulk-confirm-dialog]');
    const ticketData = JSON.parse(document.getElementById('central-ticket-data')?.textContent || '[]');
    const ticketById = new Map(ticketData.map((ticket) => [String(ticket.number), ticket]));
    let focusedTicketId = document.querySelector(`${rowSelector}.is-selected`)?.dataset.ticket || null;
    let selectedTicketId = focusedTicketId;
    let lastCheckedIndex = null;
    let commandIndex = 0;
    let pendingContextTicketId = null;
    let toastUndo = null;
    let selectedQuickRequester = null;
    let selectedQuickEndpoint = null;
    let quickLinkedRelatedIds = new Set();
    let lastQuickClipboardImageSignature = '';
    let quickClipboardReadInProgress = false;
    const quickDraftKey = 'nightowl.central.quickTicketDraft';
    const previewClosedKey = 'nightowl.central.previewClosed';
    const STATUS_LABELS = {
        new: 'Novo',
        in_progress: 'Em atendimento',
        waiting_user: 'Aguardando usuario',
        waiting_third_party: 'Aguardando terceiro',
        resolved: 'Resolvido',
        closed: 'Fechado',
        canceled: 'Cancelado',
        escalated: 'Escalado'
    };
    const PRIORITY_LABELS = { low: 'Baixa', normal: 'Normal', high: 'Alta', critical: 'Critica' };
    const STATUS_TRANSITIONS = {
        new: ['in_progress', 'waiting_user', 'resolved', 'canceled'],
        in_progress: ['waiting_user', 'waiting_third_party', 'resolved', 'escalated'],
        waiting_user: ['in_progress', 'resolved', 'canceled'],
        waiting_third_party: ['in_progress', 'waiting_user', 'resolved'],
        resolved: ['closed', 'in_progress'],
        closed: [],
        canceled: [],
        escalated: ['in_progress', 'resolved']
    };
    const SENSITIVE_STATUS = new Set(['waiting_user', 'waiting_third_party', 'resolved', 'closed', 'canceled']);
    const MACROS = [
        'Ola, estamos verificando.',
        'Poderia enviar um print do erro?',
        'Realizamos ajuste e aguardamos validacao.',
        'Chamado resolvido. Favor confirmar.'
    ];
    const QUICK_REQUESTERS = [
        { name: 'Mariana Souza', email: 'mariana.souza@nalen.local', sector: 'Financeiro', client: 'Nalen Automation', vip: false },
        { name: 'Eduardo Campos', email: 'eduardo.campos@nalen.local', sector: 'Diretoria', client: 'Nalen Automation', vip: true },
        { name: 'Renan Lima', email: 'renan.lima@nalen.local', sector: 'TI', client: 'Nalen Automation', vip: false },
        { name: 'Ana Ribeiro', email: 'ana.ribeiro@nalen.local', sector: 'Juridico', client: 'Nalen Automation', vip: false }
    ];
    const QUICK_ENDPOINTS = [
        { hostname: 'FIN-012', status: 'online', label: 'Online', user: 'mariana.souza', lastSeen: 'ha 4 min', ip: '192.168.101.88', alerts: 'antivirus sem protecao', risk: 'alto' },
        { hostname: 'DIR-NOTE-002', status: 'online', label: 'Online', user: 'eduardo.campos', lastSeen: 'ha 2 min', ip: '192.168.101.42', alerts: '0 alertas', risk: 'baixo' },
        { hostname: 'SRV-FILES-01', status: 'online', label: 'Online', user: 'system', lastSeen: 'ha 1 min', ip: '192.168.101.10', alerts: 'disco 92%', risk: 'alto' },
        { hostname: 'REC-004', status: 'offline', label: 'Offline', user: 'recepcao', lastSeen: 'ha 2h', ip: '192.168.101.74', alerts: 'sem check-in', risk: 'medio' }
    ];
    const QUICK_TEMPLATES = {
        access: { category: 'Acesso', priority: 'normal', title: 'Problema de acesso', description: 'Solicitante relata problema de acesso.\n\nSistema/servico afetado:\nImpacto:\nMensagem de erro:\nPassos ja tentados:' },
        rmm: { category: 'RMM / Alerta', priority: 'high', title: 'Alerta RMM em endpoint', description: 'Alerta de monitoramento recebido.\n\nEndpoint:\nAlerta:\nSeveridade:\nAcao inicial:' },
        slow: { category: 'Hardware', priority: 'normal', title: 'Lentidao no equipamento', description: 'Usuario relata lentidao no equipamento.\n\nQuando iniciou:\nAplicacoes afetadas:\nImpacto no trabalho:' },
        printer: { category: 'Impressora', priority: 'normal', title: 'Problema de impressao', description: 'Falha de impressao reportada.\n\nImpressora/fila:\nErro exibido:\nUsuarios afetados:' },
        mail: { category: 'E-mail', priority: 'normal', title: 'Problema de e-mail', description: 'Problema relacionado a e-mail.\n\nConta afetada:\nSintoma:\nImpacto:' },
        install: { category: 'Software', priority: 'normal', title: 'Solicitacao de instalacao', description: 'Solicitacao de instalacao ou liberacao de software.\n\nSoftware:\nJustificativa:\nPrazo:' }
    };

    ticketData.forEach((ticket) => {
        ticket.events = ticket.events || [
            { icon: 'ticket-check', text: 'Chamado criado', when: 'Hoje, 08:40', author: ticket.requester },
            ...(ticket.origin === 'rmm' ? [{ icon: 'activity', text: 'Alerta RMM recebido', when: ticket.updated_for, author: 'RMM' }] : []),
            { icon: 'user-round-check', text: ticket.assigned_to ? `${ticket.assigned_to} assumiu` : 'Sem responsavel definido', when: ticket.updated_for, author: ticket.assigned_to || 'Sistema' }
        ];
        ticket.relatedTicketIds = ticket.relatedTicketIds || ticketData
            .filter((candidate) => candidate.number !== ticket.number && (
                (ticket.endpoint?.hostname && candidate.endpoint?.hostname === ticket.endpoint.hostname)
                || candidate.requester === ticket.requester
                || candidate.category === ticket.category
            ))
            .slice(0, 3)
            .map((candidate) => candidate.number);
        if (ticket.rmm) {
            ticket.rmm.antivirus = ticket.rmm.antivirus || (ticket.title.toLowerCase().includes('bitdefender') ? 'Alerta' : 'OK');
            ticket.rmm.backup = ticket.rmm.backup || (ticket.title.toLowerCase().includes('backup') ? 'Falhou' : 'OK');
        }
    });

    function rows() {
        return Array.from(document.querySelectorAll(rowSelector));
    }

    function checks() {
        return Array.from(document.querySelectorAll('.desk-row-checkbox'));
    }

    function getVisibleTicketRows() {
        return rows().filter((row) => !row.hidden && row.offsetParent !== null);
    }

    function getRow(ticketId) {
        return rows().find((row) => row.dataset.ticket === String(ticketId));
    }

    function getTicket(ticketId) {
        return ticketById.get(String(ticketId));
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (char) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        }[char]));
    }

    function csrfToken() {
        return document.cookie.split('; ').find((row) => row.startsWith('csrftoken='))?.split('=')[1] || '';
    }

    function badgeClass(value) {
        return escapeHtml(value || 'neutral');
    }

    function ticketUrl(ticket) {
        return `/tickets/${encodeURIComponent(ticket.number)}/`;
    }

    function ticketApiUrl(ticketId, endpoint) {
        return `/tickets/${encodeURIComponent(ticketId)}/api/${endpoint}/`;
    }

    async function postTicketJson(ticketId, endpoint, payload) {
        const response = await fetch(ticketApiUrl(ticketId, endpoint), {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken(),
                'X-Requested-With': 'XMLHttpRequest',
            },
            body: JSON.stringify(payload || {}),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.ok === false) {
            throw new Error(data.error || data.errors?.request || 'Falha ao salvar alteracao.');
        }
        return data;
    }

    async function postTicketForm(ticketId, endpoint, formData) {
        const response = await fetch(ticketApiUrl(ticketId, endpoint), {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'X-CSRFToken': csrfToken(),
                'X-Requested-With': 'XMLHttpRequest',
            },
            body: formData,
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.ok === false) {
            throw new Error(data.error || 'Falha ao enviar arquivo.');
        }
        return data;
    }

    function kanbanCards() {
        return Array.from(document.querySelectorAll('.kanban-card'));
    }

    function getKanbanCard(ticketId) {
        return kanbanCards().find((card) => card.dataset.ticket === String(ticketId));
    }

    function updateKanbanCounts() {
        document.querySelectorAll('[data-kanban-column-body]').forEach((body) => {
            const status = body.dataset.kanbanColumnBody;
            const count = Array.from(body.querySelectorAll('.kanban-card')).filter((card) => !card.hidden).length;
            const badge = document.querySelector(`[data-kanban-count="${CSS.escape(status)}"]`);
            if (badge) badge.textContent = count;
            const empty = body.querySelector('.nw-kanban-empty');
            if (empty) empty.hidden = count > 0;
        });
    }

    function updateKanbanCardFromTicket(ticketId) {
        const ticket = getTicket(ticketId);
        const card = getKanbanCard(ticketId);
        if (!ticket || !card) return;
        card.dataset.status = ticket.status;
        card.dataset.priority = ticket.priority;
        card.dataset.technician = ticket.assigned_to || 'Sem responsavel';
        card.dataset.category = ticket.category || '';
        card.dataset.queue = ticket.queue || '';
        card.dataset.sla = ticket.sla_state || '';
        card.dataset.unassigned = ticket.assigned_to ? '0' : '1';
        card.dataset.reopened = ticket.is_reopened ? '1' : '0';
        card.className = `kanban-card nw-kanban-card priority-${ticket.priority} origin-${ticket.origin || 'manual'} sla-${ticket.sla_state || 'ok'} ${ticket.assigned_to ? '' : 'is-unassigned'} ${ticket.origin === 'rmm' ? 'is-rmm' : ''} ${ticket.partner ? 'is-vip' : ''} ${ticket.sla_state === 'critical' ? 'is-stale' : ''} ${ticket.is_reopened ? 'is-reopened' : ''}`;
        if (selectedTicketId === String(ticket.number)) card.classList.add('is-selected');
        const statusColumn = document.querySelector(`[data-kanban-column-body="${CSS.escape(ticket.status)}"]`);
        if (statusColumn && card.parentElement !== statusColumn) statusColumn.appendChild(card);
        const title = card.querySelector('h3');
        if (title) title.textContent = ticket.title || `Chamado #${ticket.number}`;
        const priority = card.querySelector('.nw-kanban-card__top .desk-badge');
        if (priority) {
            priority.className = `desk-badge priority-${badgeClass(ticket.priority)}`;
            priority.textContent = ticket.priority_label || PRIORITY_LABELS[ticket.priority] || ticket.priority;
        }
        const assignee = card.querySelector('[data-kanban-assignee]');
        if (assignee) assignee.textContent = ticket.assigned_to || 'Sem dono';
        const sla = card.querySelector('[data-kanban-sla]');
        if (sla) sla.textContent = ticket.sla_label || ticket.opened_for || 'Sem SLA';
        const updated = card.querySelector('footer small');
        if (updated) updated.textContent = `Atualizado ${ticket.updated_for || 'agora'}`;
        updateKanbanCounts();
    }

    function showToast(message, type = 'info', actionLabel = '', undoCallback = null) {
        if (!toast) return;
        toast.dataset.type = type;
        toast.querySelector('span').textContent = message || 'Acao aplicada.';
        const action = toast.querySelector('button');
        toastUndo = undoCallback;
        if (action) {
            action.textContent = actionLabel || 'Desfazer';
            action.hidden = !undoCallback;
        }
        toast.hidden = false;
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => { toast.hidden = true; }, 5200);
    }

    function quickField(name) {
        return quickTicketForm?.querySelector(`[name="${name}"]`);
    }

    function quickValue(name) {
        return quickField(name)?.value.trim() || '';
    }

    function setQuickValue(name, value) {
        const field = quickField(name);
        if (field) field.value = normalizeEscapedNewlines(value || '');
    }

    function normalizeEscapedNewlines(value) {
        return String(value ?? '').replace(/\\n/g, '\n');
    }

    function openQuickTicketDrawer() {
        if (!quickTicketDrawer) return;
        closeFloatingUi();
        quickTicketDrawer.hidden = false;
        quickTicketDrawer.classList.add('is-open');
        document.body.classList.add('drawer-open');
        restoreQuickDraft();
        updateQuickCritical();
        updateQuickRelated();
        quickTicketForm?.querySelector('[data-quick-requester-search]')?.focus();
        window.lucide?.createIcons?.();
    }

    function closeQuickTicketDrawer() {
        if (!quickTicketDrawer) return;
        quickTicketDrawer.classList.remove('is-open');
        quickTicketDrawer.hidden = true;
        document.body.classList.remove('drawer-open');
        quickTicketDrawer.querySelectorAll('.nw-quick-autocomplete').forEach((box) => { box.hidden = true; });
    }

    function saveQuickDraft(silent = false) {
        if (!quickTicketForm) return;
        const data = {};
        quickTicketForm.querySelectorAll('input, select, textarea').forEach((field) => {
            if (!field.name) return;
            data[field.name] = field.value;
        });
        localStorage.setItem(quickDraftKey, JSON.stringify(data));
        const status = quickTicketDrawer?.querySelector('[data-quick-draft-status]');
        if (status) status.textContent = 'Rascunho salvo agora';
        if (!silent) showToast('Rascunho salvo.', 'success');
    }

    function restoreQuickDraft() {
        const raw = localStorage.getItem(quickDraftKey);
        if (!raw || !quickTicketForm) return;
        try {
            const data = JSON.parse(raw);
            Object.entries(data).forEach(([name, value]) => setQuickValue(name, value));
        } catch (error) {}
    }

    function clearQuickDraft() {
        localStorage.removeItem(quickDraftKey);
        quickTicketForm?.reset();
        selectedQuickRequester = null;
        selectedQuickEndpoint = null;
        quickLinkedRelatedIds = new Set();
        quickTicketDrawer?.querySelector('[data-quick-requester-summary]')?.setAttribute('hidden', '');
        quickTicketDrawer?.querySelector('[data-quick-endpoint-card]')?.setAttribute('hidden', '');
        quickTicketDrawer?.querySelector('[data-quick-attachments-list]')?.setAttribute('hidden', '');
        quickTicketDrawer?.querySelector('[data-quick-requester-create]')?.setAttribute('hidden', '');
        const status = quickTicketDrawer?.querySelector('[data-quick-draft-status]');
        if (status) status.textContent = 'Rascunho descartado';
        updateQuickRelated();
        showToast('Rascunho descartado.', 'info');
    }

    function renderQuickResults(box, rows, renderer, emptyText) {
        if (!box) return;
        box.innerHTML = rows.length ? rows.map(renderer).join('') : `<p>${emptyText}</p>`;
        box.hidden = false;
        window.lucide?.createIcons?.();
    }

    function openQuickRequesterCreate() {
        const panel = quickTicketDrawer?.querySelector('[data-quick-requester-create]');
        if (!panel) return;
        panel.hidden = false;
        const name = quickTicketDrawer.querySelector('[data-quick-new-requester-name]');
        if (name && !name.value.trim()) name.value = quickValue('requester');
        quickTicketDrawer.querySelector('[data-quick-requester-results]').hidden = true;
        name?.focus();
    }

    function closeQuickRequesterCreate() {
        quickTicketDrawer?.querySelector('[data-quick-requester-create]')?.setAttribute('hidden', '');
    }

    function saveQuickRequesterCreate() {
        const name = quickTicketDrawer?.querySelector('[data-quick-new-requester-name]')?.value.trim();
        if (!name) {
            showToast('Informe o nome do solicitante.', 'warning');
            return;
        }
        const email = quickTicketDrawer.querySelector('[data-quick-new-requester-email]')?.value.trim() || '';
        const sector = quickTicketDrawer.querySelector('[data-quick-new-requester-sector]')?.value.trim() || 'Triagem';
        selectedQuickRequester = { name, email, sector, client: 'Cadastro rapido', vip: false };
        setQuickValue('requester', name);
        const summary = quickTicketDrawer?.querySelector('[data-quick-requester-summary]');
        if (summary) summary.hidden = false;
        quickTicketDrawer.querySelector('[data-quick-requester-name]').textContent = name;
        quickTicketDrawer.querySelector('[data-quick-requester-meta]').textContent = `${email || 'Sem e-mail'} · ${sector} · Cadastro rapido`;
        const vip = quickTicketDrawer.querySelector('[data-quick-requester-vip]');
        if (vip) vip.hidden = true;
        closeQuickRequesterCreate();
        updateQuickRelated();
        saveQuickDraft(true);
        showToast('Solicitante adicionado ao rascunho.', 'success');
    }

    function pickQuickRequester(name) {
        const requester = QUICK_REQUESTERS.find((item) => item.name === name);
        if (!requester) return;
        selectedQuickRequester = requester;
        setQuickValue('requester', requester.name);
        const summary = quickTicketDrawer?.querySelector('[data-quick-requester-summary]');
        if (summary) summary.hidden = false;
        quickTicketDrawer.querySelector('[data-quick-requester-name]').textContent = requester.name;
        quickTicketDrawer.querySelector('[data-quick-requester-meta]').textContent = `${requester.email} · ${requester.sector} · ${requester.client}`;
        const vip = quickTicketDrawer.querySelector('[data-quick-requester-vip]');
        if (vip) vip.hidden = !requester.vip;
        quickTicketDrawer.querySelector('[data-quick-requester-results]').hidden = true;
        updateQuickRelated();
        saveQuickDraft(true);
    }

    function pickQuickEndpoint(hostname) {
        const endpoint = QUICK_ENDPOINTS.find((item) => item.hostname === hostname);
        if (!endpoint) return;
        selectedQuickEndpoint = endpoint;
        setQuickValue('endpoint', endpoint.hostname);
        const card = quickTicketDrawer?.querySelector('[data-quick-endpoint-card]');
        if (card) {
            card.hidden = false;
            card.dataset.status = endpoint.status;
        }
        quickTicketDrawer.querySelector('[data-quick-endpoint-host]').textContent = endpoint.hostname;
        quickTicketDrawer.querySelector('[data-quick-endpoint-meta]').textContent = `${endpoint.label} · ${endpoint.user} · ${endpoint.lastSeen}`;
        quickTicketDrawer.querySelector('[data-quick-endpoint-risk]').textContent = `${endpoint.alerts} · risco ${endpoint.risk}`;
        quickTicketDrawer.querySelector('[data-quick-endpoint-results]').hidden = true;
        if (!quickValue('title')) setQuickValue('title', endpoint.alerts.includes('antivirus') ? `Bitdefender ausente em ${endpoint.hostname}` : `Chamado em ${endpoint.hostname}`);
        if (endpoint.risk === 'alto') {
            setQuickValue('priority', 'high');
            if (endpoint.alerts.includes('antivirus')) setQuickValue('category', 'Seguranca');
        }
        updateQuickCritical();
        updateQuickRelated();
        saveQuickDraft(true);
    }

    function updateQuickCritical() {
        const priority = quickValue('priority');
        const category = quickValue('category');
        if (['Seguranca', 'RMM / Alerta'].includes(category) && priority === 'normal') setQuickValue('priority', category === 'Seguranca' ? 'critical' : 'high');
        const wrap = quickTicketDrawer?.querySelector('[data-quick-critical-wrap]');
        if (wrap) wrap.hidden = quickValue('priority') !== 'critical';
    }

    function quickSelectedCategoryConfig() {
        const option = quickTicketDrawer?.querySelector('[data-quick-category]')?.selectedOptions?.[0];
        return {
            priority: option?.dataset.defaultPriority || '',
            queue: option?.dataset.defaultQueue || '',
            sla: option?.dataset.defaultSla || '',
        };
    }

    function applyQuickCategoryDefaults() {
        const config = quickSelectedCategoryConfig();
        if (config.priority) setQuickValue('priority', config.priority);
        const summary = quickTicketDrawer?.querySelector('[data-quick-category-defaults]');
        const text = quickTicketDrawer?.querySelector('[data-quick-category-defaults-text]');
        if (summary && text) {
            const priorityLabel = PRIORITY_LABELS[config.priority] || 'Normal';
            const queue = config.queue || 'N1 - Atendimento';
            const sla = config.sla || 'Sem SLA';
            text.textContent = `Prioridade ${priorityLabel} · Fila ${queue} · SLA ${sla}`;
            summary.hidden = !quickValue('category');
        }
    }

    function quickRelatedMatches() {
        const requester = quickValue('requester');
        const endpoint = quickValue('endpoint');
        const category = quickValue('category');
        const titleToken = quickValue('title').toLowerCase().split(/\s+/).find(Boolean);
        return ticketData.filter((ticket) => (
            (requester && ticket.requester === requester)
            || (endpoint && ticket.endpoint?.hostname === endpoint)
            || (category && ticket.category === category)
            || (titleToken && ticket.title.toLowerCase().includes(titleToken))
        )).slice(0, 3);
    }

    function quickRelatedReason(ticket) {
        const requester = quickValue('requester');
        const endpoint = quickValue('endpoint');
        const category = quickValue('category');
        const titleToken = quickValue('title').toLowerCase().split(/\s+/).find(Boolean);
        if (endpoint && ticket.endpoint?.hostname === endpoint) return { reason: 'Mesmo endpoint', score: 92 };
        if (requester && ticket.requester === requester) return { reason: 'Mesmo solicitante', score: 84 };
        if (category && ticket.category === category) return { reason: 'Mesma categoria', score: 72 };
        if (titleToken && ticket.title.toLowerCase().includes(titleToken)) return { reason: 'Titulo parecido', score: 68 };
        return { reason: 'Chamado recente', score: 0 };
    }

    function quickRelatedSearchResults() {
        const query = quickTicketDrawer?.querySelector('[data-quick-related-search]')?.value.trim().toLowerCase() || '';
        if (!query) return [];
        return ticketData.filter((ticket) => [
            `#${ticket.number}`,
            String(ticket.number),
            ticket.title,
            ticket.requester,
            ticket.category,
            ticket.endpoint?.hostname || ''
        ].join(' ').toLowerCase().includes(query)).slice(0, 5);
    }

    function renderQuickRelatedItem(ticket, reasonOverride = '') {
        const meta = reasonOverride ? { reason: reasonOverride, score: 0 } : quickRelatedReason(ticket);
        const linked = quickLinkedRelatedIds.has(String(ticket.number));
        const score = meta.score ? ` · ${meta.score}% similar` : '';
        return `
            <article>
                <div>
                    <strong>#${ticket.number} ${escapeHtml(ticket.title)}</strong>
                    <span>${escapeHtml(ticket.status_label || ticket.status || 'Novo')} · ${escapeHtml(ticket.requester || ticket.category || 'Desk')}</span>
                    <span>${escapeHtml(meta.reason)}${score}</span>
                </div>
                <button type="button" data-quick-link-related="${ticket.number}" ${linked ? 'disabled' : ''}>${linked ? 'Vinculado' : 'Vincular'}</button>
            </article>
        `;
    }

    function updateQuickLinkedRelated() {
        const box = quickTicketDrawer?.querySelector('[data-quick-linked-related]');
        const count = quickTicketDrawer?.querySelector('[data-quick-related-count]');
        if (count) count.textContent = quickLinkedRelatedIds.size;
        if (!box) return;
        const linked = Array.from(quickLinkedRelatedIds).map((id) => getTicket(id)).filter(Boolean);
        box.hidden = !linked.length;
        box.innerHTML = linked.length ? `
            <strong>${linked.length} vinculado${linked.length > 1 ? 's' : ''}</strong>
            <div>
                ${linked.map((ticket) => `
                    <span>#${ticket.number}

        const count = quickTicketDrawer?.querySelector('[data-quick-related-count]');
        if (!list) return;
        const linkedCount = quickLinkedRelatedIds.size;
        if (count) count.textContent = linkedCount;
        const matchesNow = quickRelatedMatches();
        const searchQuery = quickTicketDrawer?.querySelector('[data-quick-related-search]')?.value.trim() || '';
        const searchResults = quickRelatedSearchResults();
        const latest = ticketData.slice(0, 5);
        list.innerHTML = `
            <div class="nw-quick-related-block">
                <strong>Últimos chamados</strong>
                ${latest.length ? latest.map((ticket) => renderQuickRelatedItem(ticket, 'Recente')).join('') : '<p>Nenhum chamado recente.</p>'}
            </div>
            <div class="nw-quick-related-block">
                <strong>${searchQuery ? 'Resultados da busca' : 'Sugestões'}</strong>
                ${
                    searchResults.length
                        ? searchResults.map((ticket) => renderQuickRelatedItem(ticket)).join('')
                        : matchesNow.length
                            ? matchesNow.map((ticket) => renderQuickRelatedItem(ticket)).join('')
                            : '<p>Nenhum relacionado encontrado.</p>'
                }
            </div>
        `;
        updateQuickLinkedRelated();
        return;
        const matches = quickRelatedMatches();
        if (count) count.textContent = matches.length;
        if (!matches.length) {

    function addQuickAttachment(name, signature = '') {
        const list = quickTicketDrawer?.querySelector('[data-quick-attachments-list]');
        if (!list) return false;
        if (signature && Array.from(list.querySelectorAll('[data-quick-attachment-signature]')).some((item) => item.dataset.quickAttachmentSignature === signature)) return false;
        list.hidden = false;
        const signatureAttr = signature ? ` data-quick-attachment-signature="${escapeHtml(signature)}"` : '';
        list.insertAdjacentHTML('beforeend', `<span${signatureAttr}><i data-lucide="paperclip"></i>${escapeHtml(name)}<button type="button" data-quick-remove-attachment aria-label="Remover anexo">x</button></span>`);
        window.lucide?.createIcons?.();
        return true;
    }

    async function quickImageSignature(blob, imageType) {
        if (globalThis.crypto?.subtle && blob?.arrayBuffer) {
            const buffer = await blob.arrayBuffer();
            const digest = await globalThis.crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(digest)).map((byte) => byte.toString(16).padStart(2, '0')).join('');
        }
        return `${imageType}:${blob?.size || 0}`;
    }

    async function pasteQuickPrintFromClipboard() {
        if (quickClipboardReadInProgress) return;
        if (!navigator.clipboard?.read) {
            showToast('Use Ctrl+V nesta área para colar o print.', 'info');
            return;
        }
        quickClipboardReadInProgress = true;
        showToast('Verificando área de transferência...', 'info');
        try {
            const clipboardItems = await navigator.clipboard.read();
            for (const item of clipboardItems) {
                const imageType = item.types.find((type) => type.startsWith('image/'));
                if (!imageType) continue;
                const blob = await item.getType(imageType);
                const signature = await quickImageSignature(blob, imageType);
                if (signature === lastQuickClipboardImageSignature) {
                    showToast('Print já está nos anexos.', 'info');
                    return;
                }
                const added = addQuickAttachment(quickPrintAttachmentName(), signature);
                lastQuickClipboardImageSignature = signature;
                showToast(added ? 'Print adicionado aos anexos.' : 'Print já está nos anexos.', added ? 'success' : 'info');
                return;
            }
            showToast('Nenhuma imagem encontrada na área de transferência.', 'info');
        } catch (error) {
            showToast('Use Ctrl+V nesta área para colar o print.', 'info');
        } finally {
            quickClipboardReadInProgress = false;
        }
    }

    async function createQuickTicket(mode) {
        if (!validateQuickTicket()) {
            showToast('Preencha os campos obrigatorios.', 'warning');
            return;
        }
        const localPayload = quickTicketPayload(mode);
        const createButtons = quickTicketDrawer?.querySelectorAll('[data-quick-create]') || [];
        createButtons.forEach((button) => { button.disabled = true; });
        try {
            const response = await fetch(createTicketApiUrl, {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken(),
                },
                body: JSON.stringify({
                    ...localPayload,
                    mode,
                    requester_email: selectedQuickRequester?.email || '',
                    requester_department: selectedQuickRequester?.sector || localPayload.sector,
                    requester_is_partner: Boolean(selectedQuickRequester?.vip),
                    endpoint_name: selectedQuickEndpoint?.hostname || quickValue('endpoint'),
                    critical_reason: quickValue('critical_reason'),
                    related_ticket_ids: Array.from(quickLinkedRelatedIds).map(Number),
                    queue: quickSelectedCategoryConfig().queue || 'N1 - Atendimento',
                    sla_name: quickSelectedCategoryConfig().sla || '',
                }),
            });
            const result = await response.json();
            if (!response.ok || !result.ok) {
                const errors = Object.values(result.errors || { request: result.error || 'Nao foi possivel criar o chamado.' });
                const box = quickTicketDrawer?.querySelector('[data-quick-ticket-error]');
                if (box) {
                    box.hidden = false;
                    box.querySelector('ul').innerHTML = errors.map((item) => `<li>${escapeHtml(item)}</li>`).join('');
                }
                showToast('Revise os campos do chamado.', 'warning');
                return;
            }
            const ticket = result.ticket;
            ticket.relatedTicketIds = localPayload.relatedTicketIds || [];
            prependQuickTicketRow(ticket);
            localStorage.removeItem(quickDraftKey);
            closeQuickTicketDrawer();
            quickLinkedRelatedIds = new Set();
            updateQuickRelated();
            showToast(mode === 'assign' ? `Chamado #${ticket.number} criado e assumido.` : `Chamado #${ticket.number} criado.`, 'success');
            if (mode === 'assign') {
                setTimeout(() => { window.location.href = ticket.detail_url || ticketUrl(ticket); }, 450);
            } else {
                selectTicketForPreview(ticket.number);
            }
        } catch (error) {
            showToast('Falha ao comunicar com o servidor.', 'warning');
        } finally {
            createButtons.forEach((button) => { button.disabled = false; });
        }
    }

    function focusTicketRow(ticketId, options = {}) {
        const visible = getVisibleTicketRows();
        if (!visible.length) return null;
        const fallback = visible[0];
        const row = getRow(ticketId) && visible.includes(getRow(ticketId)) ? getRow(ticketId) : fallback;
        rows().forEach((item) => item.classList.remove('is-key-focused'));
        row.classList.add('is-key-focused');
        focusedTicketId = row.dataset.ticket;
        if (options.scroll !== false) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        if (options.domFocus !== false) row.focus({ preventScroll: true });
        if (options.select) selectTicketForPreview(focusedTicketId);
        return row;
    }

    function moveTicketFocus(direction) {
        const visible = getVisibleTicketRows();
        if (!visible.length) return;
        const currentIndex = visible.findIndex((row) => row.dataset.ticket === focusedTicketId);
        const nextIndex = currentIndex < 0
            ? (direction > 0 ? 0 : visible.length - 1)
            : Math.max(0, Math.min(visible.length - 1, currentIndex + direction));
        focusTicketRow(visible[nextIndex].dataset.ticket, { select: true });
    }

    function getNextBestAction(ticket) {
        if (ticket.status === 'closed' || ticket.status === 'canceled') {
            return { tone: 'neutral', icon: 'lock', title: 'Chamado somente leitura', text: 'Este chamado foi encerrado e fica disponivel para consulta.', action: 'Abrir tela cheia', type: 'drawer' };

        if (ticket.status === 'resolved') {

        }
        const waitingUser = ticket.status === 'waiting_user';
        const hasRelated = Number(ticket.relatedTicketIds?.length || 0) > 0;
        if (!ticket.assigned_to) {
            return { tone: 'warning', icon: 'user-plus', title: 'Chamado sem responsavel', text: 'Assuma ou atribua este chamado para iniciar o atendimento.', action: 'Assumir atendimento', type: 'assign' };
        }
        if (ticket.sla_state === 'critical') {
            return { tone: 'critical', icon: 'alarm-clock', title: 'SLA vencido', text: 'Este chamado ultrapassou o prazo. Registre uma atualizacao ou escale o atendimento.', action: 'Escalar', type: 'escalate' };
        }
        if (ticket.sla_state === 'warning') {
            return { tone: 'warning', icon: 'timer', title: 'SLA vencendo em breve', text: 'Priorize uma primeira resposta ou atualizacao para evitar estouro de SLA.', action: 'Comentar agora', type: 'comment' };
        }
        if (ticket.origin === 'rmm' && ticket.endpoint?.status === 'offline') {
            return { tone: 'warning', icon: 'wifi-off', title: 'Endpoint offline', text: 'O dispositivo nao esta comunicando com o RMM. Verifique o ultimo check-in antes do acesso remoto.', action: 'Ver dispositivo', type: 'device' };
        }
        if (ticket.origin === 'rmm' && Number(ticket.rmm?.active_alerts || 0) > 0) {
            return { tone: 'info', icon: 'activity', title: 'Alerta RMM ativo', text: 'Revise a telemetria do endpoint antes da proxima acao.', action: 'Abrir no RMM', type: 'rmm' };
        }
        if (waitingUser) {
            return { tone: 'warning', icon: 'mail-question', title: 'Aguardando retorno', text: 'Considere enviar um lembrete ao solicitante.', action: 'Enviar lembrete', type: 'reminder' };
        }
        if (hasRelated) {
            return { tone: 'info', icon: 'git-merge', title: 'Possiveis relacionados', text: 'Ha chamados semelhantes para este solicitante ou endpoint.', action: 'Ver relacionados', type: 'related' };
        }
        return { tone: 'neutral', icon: 'sparkles', title: 'Chamado pronto para triagem', text: 'Revise os detalhes e registre a proxima atualizacao.', action: 'Comentar', type: 'comment' };

        if (!rmm) return renderNoEndpointCard();
        const remoteDisabled = endpoint?.status === 'offline' ? 'disabled title="Endpoint offline"' : '';
        const diskCritical = Number(rmm.disk || 0) >= 90;
        return `
            <article class="desk-rmm-mini-card risk-${badgeClass(rmm.risk)}">
                <header>
                    <div>
                        <span class="desk-section-eyebrow">RMM endpoint</span>
                        <h3>${escapeHtml(rmm.hostname)}</h3>
                        <p><i class="desk-status-dot status-${badgeClass(endpoint?.status)}"></i>${escapeHtml(rmm.status_label)} &middot; ultimo check-in ${escapeHtml(rmm.last_seen)}</p>
                    </div>
                    <span class="desk-rmm-alert-pill">${escapeHtml(rmm.active_alerts)} alertas</span>
                </header>
                <div class="desk-rmm-metrics">
                    <div class="tone-${metricTone(rmm.cpu)}"><span>CPU</span><meter value="${escapeHtml(rmm.cpu)}" min="0" max="100"></meter><strong>${escapeHtml(rmm.cpu)}%</strong></div>
                    <div class="tone-${metricTone(rmm.memory)}"><span>Mem</span><meter value="${escapeHtml(rmm.memory)}" min="0" max="100"></meter><strong>${escapeHtml(rmm.memory)}%</strong></div>
                    <div class="tone-${metricTone(rmm.disk)}"><span>Disco</span><meter value="${escapeHtml(rmm.disk)}" min="0" max="100"></meter><strong>${escapeHtml(rmm.disk)}%</strong></div>
                </div>
                <div class="nw-rmm-status-grid">
                    <span>Usuario logado: <strong>${escapeHtml(rmm.logged_user)}</strong></span>
                    <span>Antivirus: <strong>${escapeHtml(rmm.antivirus || 'OK')}</strong></span>
                    <span>Backup: <strong>${escapeHtml(rmm.backup || 'OK')}</strong></span>
                    ${diskCritical ? '<span class="is-critical">Disco critico</span>' : ''}
                </div>
                <div class="desk-rmm-actions">
                    <a class="desk-btn" href="${endpointUrl}">Ver dispositivo</a>
                    <button class="desk-btn" type="button" data-preview-action="open-rmm">Abrir no RMM</button>
                    <button class="desk-btn desk-btn-primary" type="button" data-preview-action="remote" ${remoteDisabled}>Acesso remoto</button>
                </div>
            </article>
        `;
    }

    function renderPreview(ticket) {
        if (!previewPanel || !ticket) return;
        const endpoint = ticket.endpoint;
        const action = getNextBestAction(ticket);
        const primaryLabel = !ticket.assigned_to ? 'Assumir atendimento' : 'Atribuir a mim';
        const canAssume = !['resolved', 'closed', 'canceled'].includes(ticket.status);
        const canComment = !['resolved', 'closed', 'canceled'].includes(ticket.status);
        const canChangeStatus = (STATUS_TRANSITIONS[ticket.status] || []).length > 0;
        previewPanel.classList.add('is-switching');
        previewPanel.innerHTML = `
            <header class="desk-detail-panel-header">
                <div>
                    <span class="desk-ticket-number">#${escapeHtml(ticket.number)}</span>
                    <h2>${escapeHtml(ticket.title)}</h2>
                    <p>${escapeHtml(ticket.requester)} &middot; ${escapeHtml(ticket.sector)} &middot; aberto ha ${escapeHtml(ticket.opened_for)}</p>
                </div>
                <div class="desk-preview-header-actions">
                    <button class="desk-icon-action" type="button" data-preview-action="copy" aria-label="Copiar link"><i data-lucide="link"></i></button>
                    <button class="desk-icon-action" type="button" data-preview-action="drawer" aria-label="Abrir detalhe rapido"><i data-lucide="sidebar"></i></button>
                    <button class="desk-icon-action" type="button" data-preview-action="more" aria-label="Mais acoes"><i data-lucide="more-horizontal"></i></button>
                    <a class="desk-icon-action" href="${ticketUrl(ticket)}" aria-label="Abrir em tela cheia"><i data-lucide="maximize-2"></i></a>
                    <button class="desk-icon-action" type="button" data-preview-hide aria-label="Ocultar preview"><i data-lucide="panel-right-close"></i></button>
                    <button class="desk-icon-action" type="button" data-preview-clear aria-label="Limpar selecao"><i data-lucide="x"></i></button>
                </div>
            </header>
            <div class="desk-detail-inline-state">
                <span class="desk-badge status-${badgeClass(ticket.status)}">${escapeHtml(ticket.status_label)}</span>
                <span class="desk-badge priority-${badgeClass(ticket.priority)}">${escapeHtml(ticket.priority_label)}</span>
                ${ticket.partner ? '<span class="desk-badge partner-badge">Socio / VIP</span>' : ''}
                <span class="desk-origin-badge origin-${badgeClass(ticket.origin)}">${escapeHtml(ticket.origin_label)}</span>
                <span class="desk-badge neutral">${escapeHtml(ticket.category)}</span>
            </div>
            <section class="desk-detail-panel-body">
                <article class="desk-suggestion-card nw-next-action nw-next-action--${action.tone}">
                    <i data-lucide="${action.icon}"></i>
                    <div><strong>${escapeHtml(action.title)}</strong><p>${escapeHtml(action.text)}</p></div>
                    <button class="desk-btn" type="button" data-preview-action="${action.type}">${escapeHtml(action.action)}</button>
                </article>
                <div class="desk-preview-grid">
                    <article class="desk-preview-stat"><span>SLA</span><strong>${escapeHtml(ticket.sla_label)}</strong><small>${escapeHtml(ticket.opened_for)} aberto</small></article>
                    <article class="desk-preview-stat"><span>Responsavel</span><strong data-preview-assignee>${escapeHtml(ticket.assigned_to || 'Sem dono')}</strong><small>${escapeHtml(ticket.updated_for)} sem atualizacao</small></article>
                </div>
                ${renderRmmCard(ticket)}
                <article class="desk-detail-section">
                    <h3>Descricao</h3>
                    <p>${escapeHtml(ticket.description)}</p>
                    <div class="desk-preview-badges">
                        <span class="desk-badge neutral">${escapeHtml(ticket.category)}</span>
                        ${endpoint ? `<span class="desk-endpoint-chip status-${badgeClass(endpoint.status)}"><i></i><span class="mono">${escapeHtml(endpoint.hostname)}</span></span>` : ''}
                    </div>
                </article>
                <article class="desk-detail-section"><h3>Ultimos comentarios</h3><div class="desk-comments" data-preview-comments>${renderComments(ticket)}</div></article>
                ${renderAttachments(ticket)}
                ${renderRelated(ticket)}
                <article class="desk-detail-section">
                    <h3>Eventos recentes</h3>
                    <div class="desk-preview-timeline">${renderEvents(ticket)}</div>
                </article>
                <div class="desk-quick-actions">
                    ${canAssume ? `<button class="desk-btn desk-btn-primary" type="button" data-preview-action="assign">${escapeHtml(primaryLabel)}</button>` : ''}
                    ${canChangeStatus ? '<button class="desk-btn" type="button" data-preview-action="status">Mudar status</button>' : ''}
                    <button class="desk-btn" type="button" data-preview-action="priority">Mudar prioridade</button>
                    ${canComment ? '<button class="desk-btn" type="button" data-preview-action="comment">Comentar</button>' : ''}

                    ${ticket.rmm ? '<button class="desk-btn" type="button" data-preview-action="open-rmm">Abrir no RMM</button>' : ''}
                    ${ticket.endpoint?.status === 'online' ? '<button class="desk-btn" type="button" data-preview-action="remote">Acesso remoto</button>' : ''}
                    ${ticket.relatedTicketIds?.length ? '<button class="desk-btn" type="button" data-preview-action="related">Ver relacionados</button>' : ''}

            </section>
            ${canComment ? `<form class="desk-comment-dock" data-comment-form>
                <textarea name="body" rows="3" placeholder="Comentario rapido..."></textarea>
                <div class="nw-comment-tools">

                        <button class="desk-icon-action" type="button" data-mock-macro aria-label="Inserir macro"><i data-lucide="text-cursor-input"></i></button>
                        <button class="desk-icon-action" type="button" data-preview-attach aria-label="Anexar arquivo"><i data-lucide="paperclip"></i></button>
                        <input type="file" data-preview-attachment-input hidden multiple>
                        <label class="desk-check"><input type="checkbox" name="internal" checked><span>Interno</span></label>
                    </div>
                    <small data-public-warning hidden>Este comentario sera visivel ao solicitante.</small>
                    <span class="desk-muted">Ctrl+Enter para enviar</span>
                    <button class="desk-btn desk-btn-primary" type="submit"><i data-lucide="send"></i>Enviar</button>
