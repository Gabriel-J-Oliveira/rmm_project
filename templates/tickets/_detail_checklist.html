<article class="desk-panel nw-service-checklist" data-service-checklist>
    <div class="desk-panel-title-row">
        <div>
            <h2><i data-lucide="list-checks"></i>Checklist de atendimento</h2>
            <p>Etapas sugeridas para conduzir e encerrar este chamado com seguranca.</p>
        </div>
        <div class="nw-service-checklist__progress">
            <strong data-service-checklist-count>0/7 concluido</strong>
            <span data-service-checklist-state>Em andamento</span>
        </div>
    </div>

    <div class="nw-service-checklist__bar" aria-hidden="true">
        <i data-service-checklist-bar style="width: 0%"></i>
    </div>

    <div class="nw-service-checklist__grid">
        <label class="desk-check"><input type="checkbox" data-service-check><span>Validar identidade do solicitante.</span></label>
        <label class="desk-check"><input type="checkbox" data-service-check><span>Confirmar impacto e urgencia.</span></label>
        <label class="desk-check"><input type="checkbox" data-service-check><span>Verificar endpoint vinculado no RMM.</span></label>
        <label class="desk-check"><input type="checkbox" data-service-check><span>Registrar atualizacao interna ou publica.</span></label>
        <label class="desk-check"><input type="checkbox" data-service-check><span>Confirmar solucao com o solicitante.</span></label>
        <label class="desk-check"><input type="checkbox" data-service-check><span>Anexar evidencia, se necessario.</span></label>
        <label class="desk-check"><input type="checkbox" data-service-check><span>Revisar categoria e prioridade antes de resolver.</span></label>
    </div>
</article>
