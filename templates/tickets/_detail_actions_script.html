{{ ticket_detail_state|json_script:"ticket-detail-state" }}
<script>
(() => {
    const stateEl = document.getElementById('ticket-detail-state');
    const state = stateEl ? JSON.parse(stateEl.textContent) : {};
    const CURRENT_USER = 'Gabriel';
    const STATUS_LABELS = {
        new: 'Novo',
        in_progress: 'Em atendimento',
        waiting_user: 'Aguardando usuario',
        waiting_third_party: 'Aguardando terceiro',
        escalated: 'Escalado',
        resolved: 'Resolvido',
    };
    const PRIORITY_LABELS = { low: 'Baixa', normal: 'Normal', high: 'Alta', critical: 'Critica' };
    const resolutionDrawer = document.querySelector('[data-resolution-drawer]');
    const escalationDrawer = document.querySelector('[data-escalation-drawer]');
    const auditDrawer = document.querySelector('[data-audit-drawer]');
    const toast = document.querySelector('[data-toast]');
    const form = document.querySelector('[data-detail-comment-form]');
    const textarea = document.querySelector('[data-detail-comment-textarea]');
    const attachmentsBox = document.querySelector('[data-comment-attachments]');
    const rmmConfirmModal = document.querySelector('[data-rmm-confirm-modal]');
    const rmmMessageModal = document.querySelector('[data-rmm-message-modal]');
    const attachmentPreviewModal = document.querySelector('[data-attachment-preview-modal]');
    const attachmentDeleteModal = document.querySelector('[data-attachment-delete-modal]');
    const relatedLinkModal = document.querySelector('[data-related-link-modal]');
    const relatedMergeModal = document.querySelector('[data-related-merge-modal]');
    const relatedReferenceModal = document.querySelector('[data-related-reference-modal]');
    let toastUndo = null;
    let activeActivityFilter = 'all';
    let serviceChecklistComplete = false;
    let pendingRmmAction = null;
    let activeScriptRiskFilter = 'all';
    let activeAttachmentFilter = 'all';
    let currentAttachmentId = null;
    let pendingAttachmentDelete = null;
    let currentReferenceCard = null;

    function all(selector, root = document) {
        return Array.from(root.querySelectorAll(selector));
    }

    function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, (char) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
        }[char]));
    }

    function showToast(message, actionLabel = '', undo = null) {
        if (!toast) return;
        toast.querySelector('span').textContent = message;
        const button = toast.querySelector('button');
        toastUndo = undo;
        if (button) {
            button.textContent = actionLabel || 'Desfazer';
            button.hidden = !undo;
        }
        toast.hidden = false;
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => { toast.hidden = true; }, 5200);
    }

    function openDrawer(drawer) {
        if (!drawer) return;
        closeDrawers();
        drawer.hidden = false;
        drawer.classList.add('is-open');
        document.body.classList.add('drawer-open');
        window.lucide?.createIcons?.();
    }

    function closeDrawers() {
        [resolutionDrawer, escalationDrawer].forEach((drawer) => {
            if (!drawer) return;
            drawer.classList.remove('is-open');
            drawer.hidden = true;
        });
        if (auditDrawer) {
            auditDrawer.classList.remove('is-open');
            auditDrawer.hidden = true;
        }
        document.body.classList.remove('drawer-open');
    }

    function openAudit() {
        if (!auditDrawer) return;
        closeDrawers();
        auditDrawer.hidden = false;
        auditDrawer.classList.add('is-open');
        document.body.classList.add('drawer-open');
        updateAuditCounts();
        filterAudit();
        window.lucide?.createIcons?.();
    }

    function closeAudit() {
        if (!auditDrawer) return;
        auditDrawer.classList.remove('is-open');
        auditDrawer.hidden = true;
        document.body.classList.remove('drawer-open');
    }

    function auditRows() {
        return all('[data-audit-row]');
    }

    function updateAuditCounts() {
        const rows = auditRows();
        const visibleRows = rows.filter((row) => !row.hidden);
        const total = document.querySelector('[data-audit-total]');
        const sensitive = document.querySelector('[data-audit-sensitive-total]');
        if (total) total.textContent = visibleRows.length || rows.length;
        if (sensitive) sensitive.textContent = rows.filter((row) => row.dataset.auditSeverity === 'sensitive').length;
    }

    function filterAudit() {
        const query = document.querySelector('[data-audit-search]')?.value.trim().toLowerCase() || '';
        const type = document.querySelector('[data-audit-type]')?.value || 'all';
        const user = document.querySelector('[data-audit-user]')?.value || 'all';
        const period = document.querySelector('[data-audit-period]')?.value || 'today';
        let visible = 0;
        auditRows().forEach((row) => {
            const typeMatch = type === 'all' || row.dataset.auditType === type;
            const userMatch = user === 'all' || row.dataset.auditUser === user;
            const periodMatch = period === 'all' || row.dataset.auditPeriod === period || ['7d', '30d'].includes(period);
            const queryMatch = !query || row.textContent.toLowerCase().includes(query);
            const match = typeMatch && userMatch && periodMatch && queryMatch;
            row.hidden = !match;
            if (match) visible += 1;
        });
        const empty = document.querySelector('[data-audit-empty]');
        if (empty) empty.hidden = visible > 0;
        const total = document.querySelector('[data-audit-total]');
        if (total) total.textContent = visible;
    }

    function addAuditEvent(event = {}) {
        const list = document.querySelector('[data-audit-list]');
        if (!list) return;
        const type = event.type || 'field';
        const user = event.user || CURRENT_USER;
        const severity = event.severity || 'info';
        const oldValue = event.oldValue || '-';
        const newValue = event.newValue || '-';
        const origin = event.origin || '192.168.101.47 - Web';
        const row = document.createElement('article');
        row.className = `nw-audit-row${severity === 'sensitive' ? ' nw-audit-row--sensitive' : ''}`;
        row.dataset.auditRow = '';
        row.dataset.auditType = type;
        row.dataset.auditUser = user;
        row.dataset.auditPeriod = 'today';
        row.dataset.auditSeverity = severity;
        row.innerHTML = `
            <button type="button" data-audit-toggle>
                <time>agora</time>
                <strong>${escapeHtml(user)}</strong>
                <span class="nw-audit-badge${severity === 'sensitive' ? ' nw-audit-badge--sensitive' : ''}">${escapeHtml(event.badge || type)}</span>
                <span>${escapeHtml(event.action || 'Evento registrado')}</span>
                <span class="nw-audit-diff"><em>${escapeHtml(event.oldValue || '—')}</em><i>-></i><b>${escapeHtml(event.newValue || '—')}</b></span>
                <small>${escapeHtml(event.origin || '192.168.101.47 · Web')}</small>
            </button>
            <div class="nw-audit-event-details" hidden><pre>${escapeHtml(JSON.stringify(event.payload || event, null, 2))}</pre></div>
        `;
        list.prepend(row);
        updateAuditCounts();
        filterAudit();
    }

    function copyAuditSummary() {
        const total = document.querySelector('[data-audit-total]')?.textContent || auditRows().length;
        const text = `Auditoria do chamado #${state.number}: ${total} eventos, ultima alteracao por Gabriel em 09:18.`;
        navigator.clipboard?.writeText(text);
        showToast('Resumo da auditoria copiado.');
    }

    function exportAuditCsv() {
        const rows = auditRows().filter((row) => !row.hidden).map((row) => {
            const cells = Array.from(row.querySelectorAll('time,strong,.nw-audit-badge,button > span:not(.nw-audit-diff),small')).map((cell) => `"${cell.textContent.trim().replace(/"/g, '""')}"`);
            return cells.join(',');
        });
        const csv = ['"Data","Usuario","Tipo","Acao","Origem"', ...rows].join('\n');
        const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = `auditoria-chamado-${state.number}.csv`;
        link.click();
        URL.revokeObjectURL(url);
        showToast('Exportacao de auditoria iniciada.');
    }

    function addActivity(kind, icon, title, body, badge = 'Sistema') {
        const feed = document.querySelector('[data-detail-activity-feed]');
        if (!feed) return;
        const item = document.createElement('div');
        item.className = `desk-activity-item activity-${kind} nw-timeline-event--${kind}`;
        item.dataset.activityKind = kind;
        item.innerHTML = `
            <span class="desk-activity-icon"><i data-lucide="${icon}"></i></span>
            <div>
                <header>
                    <strong>${escapeHtml(title)}</strong>
                    <small>agora</small>
                    <em class="nw-activity-badge">${escapeHtml(badge)}</em>
                </header>
                <p>${escapeHtml(body)}</p>
            </div>
        `;
        feed.prepend(item);
        updateActivityCounts();
        filterActivity(activeActivityFilter);
        window.lucide?.createIcons?.();
    }

    function addDeviceHistory(kind, icon, title, status = 'registrado', origin = CURRENT_USER) {
        const list = document.querySelector('[data-device-history-list]');
        if (!list) return;
        const item = document.createElement('article');
        item.dataset.deviceHistoryKind = kind;
        item.innerHTML = `
            <i data-lucide="${icon}"></i>
            <div>
                <strong>${escapeHtml(title)}</strong>
                <span>agora - ${escapeHtml(origin)}</span>
            </div>
            <em>${escapeHtml(status)}</em>
        `;
        list.prepend(item);
        filterDeviceHistory(document.querySelector('[data-device-history-filter].is-active')?.dataset.deviceHistoryFilter || 'all');
        window.lucide?.createIcons?.();
    }

    function updateActivityCounts() {
        const rows = all('[data-activity-kind]');
        const counts = rows.reduce((acc, row) => {
            const kind = row.dataset.activityKind;
            acc.all += 1;
            acc[kind] = (acc[kind] || 0) + 1;
            return acc;
        }, { all: 0 });
        all('[data-activity-count]').forEach((node) => {
            node.textContent = counts[node.dataset.activityCount] || 0;
        });
        const total = document.querySelector('[data-activity-total]');
        if (total) total.textContent = `${counts.all} eventos`;
    }

    function filterActivity(kind) {
        activeActivityFilter = kind;
        let visible = 0;
        all('[data-activity-filter]').forEach((button) => {
            button.classList.toggle('is-active', button.dataset.activityFilter === kind);
        });
        all('[data-activity-kind]').forEach((row) => {
            const match = kind === 'all' || row.dataset.activityKind === kind;
            row.hidden = !match;
            if (match) visible += 1;
        });
        const empty = document.querySelector('[data-activity-empty]');
        if (empty) {
            empty.hidden = visible > 0;
            empty.style.display = visible > 0 ? 'none' : '';
        }
    }

    function filterDeviceHistory(kind) {
        let visible = 0;
        all('[data-device-history-filter]').forEach((button) => {
            button.classList.toggle('is-active', button.dataset.deviceHistoryFilter === kind);
        });
        all('[data-device-history-kind]').forEach((row) => {
            const match = kind === 'all' || row.dataset.deviceHistoryKind === kind;
            row.hidden = !match;
            if (match) visible += 1;
        });
        const empty = document.querySelector('[data-device-history-empty]');
        if (empty) empty.hidden = visible > 0;
    }

    function relatedCards() {
        return all('[data-related-card]');
    }

    function selectedRelatedCards() {
        return relatedCards().filter((card) => card.querySelector('[data-related-select]')?.checked);
    }

    function updateRelatedCounts() {
        all('[data-related-group]').forEach((group) => {
            const count = all('[data-related-card]', group).filter((card) => !card.hidden).length;
            group.hidden = count === 0;
            const node = group.querySelector('[data-related-group-count]');
            if (node) node.textContent = count;
        });
        const total = relatedCards().length;
        const totalNode = document.querySelector('[data-related-total]');
        if (totalNode) totalNode.textContent = `${total} relacionados`;
    }

    function updateRelatedSelection() {
        const selected = selectedRelatedCards();
        relatedCards().forEach((card) => {
            card.classList.toggle('nw-related-item--selected', card.querySelector('[data-related-select]')?.checked);
        });
        const button = document.querySelector('[data-related-merge-open]');
        const label = document.querySelector('[data-related-merge-label]');
        if (label) label.textContent = selected.length > 0 ? `Mesclar ${selected.length}` : 'Mesclar';
        if (button) {
            const disabled = selected.length < 2;
            button.classList.toggle('is-disabled', disabled);
            button.setAttribute('aria-disabled', disabled ? 'true' : 'false');
            button.title = disabled ? 'Selecione dois ou mais chamados para mesclar.' : 'Mesclar chamados selecionados.';
        }
    }

    function relatedSolution(card) {
        return `Solucao usada no chamado #${card.dataset.relatedNumber}: validar o contexto com o solicitante, confirmar endpoint ${card.dataset.relatedEndpoint}, aplicar ajuste tecnico relacionado a ${card.dataset.relatedCategory} e registrar evidencia antes do fechamento.`;
    }

    function renderRelatedPreview(card) {
        const panel = document.querySelector('[data-related-preview-panel]');
        if (!card || !panel) return;
        relatedCards().forEach((item) => item.classList.toggle('is-active', item === card));
        const resolved = card.dataset.relatedResolved === '1';
        panel.innerHTML = `
            <header>
                <span class="nw-device-kicker">Preview relacionado</span>
                <h3>#${escapeHtml(card.dataset.relatedNumber)} ${escapeHtml(card.dataset.relatedTitle)}</h3>
                <p>${escapeHtml(card.dataset.relatedSummary)}</p>
            </header>
            <dl>
                <div><dt>Status</dt><dd>${escapeHtml(card.dataset.relatedStatus)}</dd></div>
                <div><dt>Prioridade</dt><dd>${escapeHtml(card.dataset.relatedPriority)}</dd></div>
                <div><dt>Solicitante</dt><dd>${escapeHtml(card.dataset.relatedRequester)}</dd></div>
                <div><dt>Endpoint</dt><dd>${escapeHtml(card.dataset.relatedEndpoint)}</dd></div>
                <div><dt>Categoria</dt><dd>${escapeHtml(card.dataset.relatedCategory)}</dd></div>
                <div><dt>Relacao</dt><dd>${escapeHtml(card.dataset.relatedReason)} - ${escapeHtml(card.dataset.relatedScore)}% similar</dd></div>
            </dl>
            <div class="nw-related-preview-actions">
                <a class="desk-btn desk-btn-primary" href="${escapeHtml(card.dataset.relatedUrl)}">Abrir chamado</a>
                <button class="desk-btn" type="button" data-related-link-open>Vincular</button>
                <button class="desk-btn" type="button" data-related-merge-open>Mesclar</button>
                ${resolved ? '<button class="desk-btn" type="button" data-related-reference>Usar solucao como referencia</button>' : ''}
            </div>
        `;
    }

    function closeRelatedModals() {
        [relatedLinkModal, relatedMergeModal, relatedReferenceModal].forEach((modal) => {
            if (modal) modal.hidden = true;
        });
        currentReferenceCard = null;
    }

    function openRelatedLinkModal() {
        if (!relatedLinkModal) return;
        relatedLinkModal.hidden = false;
        relatedLinkModal.querySelector('[data-related-link-search]')?.focus();
        window.lucide?.createIcons?.();
    }

    function openRelatedMergeModal() {
        const selected = selectedRelatedCards();
        if (selected.length < 2 || !relatedMergeModal) {
            showToast('Selecione dois ou mais chamados para mesclar.');
            return;
        }
        const list = relatedMergeModal.querySelector('[data-related-merge-list]');
        if (list) {
            list.innerHTML = selected.map((card, index) => `
                <label>
                    <input type="radio" name="merge_primary" value="${escapeHtml(card.dataset.relatedNumber)}" ${index === 0 ? 'checked' : ''}>
                    <span><strong>#${escapeHtml(card.dataset.relatedNumber)} ${escapeHtml(card.dataset.relatedTitle)}</strong><small>${escapeHtml(card.dataset.relatedReason)} - ${escapeHtml(card.dataset.relatedStatus)}</small></span>
                </label>
            `).join('');
        }
        relatedMergeModal.hidden = false;
        relatedMergeModal.querySelector('[data-related-merge-reason]')?.focus();
        window.lucide?.createIcons?.();
    }

    function openReferenceSolution(card) {
        currentReferenceCard = card || document.querySelector('[data-related-card].is-active');
        if (!currentReferenceCard || !relatedReferenceModal) {
            showToast('Selecione um chamado resolvido para usar como referencia.');
            return;
        }
        relatedReferenceModal.querySelector('[data-reference-title]').textContent = `Solucao do chamado #${currentReferenceCard.dataset.relatedNumber}`;
        relatedReferenceModal.querySelector('[data-reference-subtitle]').textContent = `${currentReferenceCard.dataset.relatedReason} - ${currentReferenceCard.dataset.relatedScore}% similar`;
        relatedReferenceModal.querySelector('[data-reference-body]').innerHTML = `<p>${escapeHtml(relatedSolution(currentReferenceCard))}</p>`;
        relatedReferenceModal.hidden = false;
        window.lucide?.createIcons?.();
    }

    function addManualRelated(number, title, requester, endpoint, reason) {
        const list = document.querySelector('[data-related-manual-list]');
        if (!list) return;
        const card = document.createElement('article');
        card.className = 'nw-related-item nw-related-item--selectable';
        card.dataset.relatedCard = '';
        card.dataset.relatedNumber = number;
        card.dataset.relatedTitle = title;
        card.dataset.relatedStatus = 'Vinculado';
        card.dataset.relatedPriority = 'Normal';
        card.dataset.relatedCategory = 'Referencia';
        card.dataset.relatedRequester = requester;
        card.dataset.relatedEndpoint = endpoint;
        card.dataset.relatedSummary = `Vinculo manual criado por ${CURRENT_USER}. Motivo: ${reason}.`;
        card.dataset.relatedReason = 'Vinculado manualmente';
        card.dataset.relatedScore = '100';
        card.dataset.relatedResolved = '0';
        card.dataset.relatedUrl = `/tickets/${number}/`;
        card.innerHTML = `
            <label class="nw-related-select" title="Selecionar para mesclagem"><input type="checkbox" data-related-select></label>
            <button type="button" data-related-preview>
                <strong>#${escapeHtml(number)}</strong>
                <span>${escapeHtml(title)}</span>
                <small>Vinculado manualmente</small>
                <em>Vinculado</em>
                <b>Normal - Referencia</b>
                <i class="nw-related-score">100% similar</i>
            </button>
            <div>
                <button class="nw-related-action" type="button" title="Visualizar preview" aria-label="Visualizar preview" data-related-preview><i class="bi bi-eye" aria-hidden="true"></i></button>
                <a class="nw-related-action" href="/tickets/${escapeHtml(number)}/" title="Abrir chamado" aria-label="Abrir chamado"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i></a>
                <button class="nw-related-action" type="button" title="Vincular chamado" aria-label="Vincular chamado" data-related-link-open><i class="bi bi-link-45deg" aria-hidden="true"></i></button>
                <button class="nw-related-action" type="button" title="Mesclar" aria-label="Mesclar" data-related-merge-open><i class="bi bi-intersect" aria-hidden="true"></i></button>
                <button class="nw-related-action" type="button" title="Mais acoes" aria-label="Mais acoes" data-related-more><i class="bi bi-three-dots" aria-hidden="true"></i></button>
            </div>
        `;
        list.prepend(card);
        updateRelatedCounts();
        updateRelatedSelection();
        renderRelatedPreview(card);
        window.lucide?.createIcons?.();
    }

    function moveMergedCards(primaryNumber, reason) {
        const list = document.querySelector('[data-related-merged-list]');
        const selected = selectedRelatedCards();
        if (!list) return;
        selected.forEach((card) => {
            const check = card.querySelector('[data-related-select]');
            if (check) check.checked = false;
            card.dataset.relatedReason = card.dataset.relatedNumber === primaryNumber ? 'Chamado principal' : 'Duplicado mesclado';
            card.dataset.relatedSummary = `${card.dataset.relatedSummary} Mesclagem: ${reason}`;
            card.querySelector('small').textContent = card.dataset.relatedReason;
            list.appendChild(card);
        });
        updateRelatedCounts();
        updateRelatedSelection();
    }

    function updateBadges() {
        all('[data-ticket-status-badge]').forEach((badge) => {
            badge.className = `desk-badge status-${state.status}`;
            badge.textContent = state.statusLabel;
        });
        all('[data-ticket-priority-badge]').forEach((badge) => {
            badge.className = `desk-badge priority-${state.priority}`;
            badge.textContent = state.priorityLabel;
        });
        all('[data-ticket-category]').forEach((badge) => {
            badge.textContent = state.category || 'Sem categoria';
        });
        all('[data-ticket-assignee]').forEach((assignee) => {
            assignee.innerHTML = `<span class="desk-avatar">${escapeHtml((state.assignedTo || '?').slice(0, 1))}</span>${escapeHtml(state.assignedTo || 'Sem responsavel')}`;
        });
        all('[data-ticket-sla-chip]').forEach((sla) => {
            const level = state.resolved ? 'ok' : state.slaLevel;
            sla.className = `desk-sla-chip desk-sla-${level}`;
            sla.innerHTML = `<i data-lucide="timer"></i>${escapeHtml(state.resolved ? 'Resolvido agora' : state.slaLabel)}`;
        });
        all('[data-ticket-sla-state]').forEach((node) => {
            node.textContent = state.resolved ? 'concluido' : state.slaLevel;
        });
        const remaining = document.querySelector('[data-ticket-sla-remaining]');
        const caption = document.querySelector('[data-ticket-sla-caption]');
        const fill = document.querySelector('[data-ticket-sla-fill]');
        if (state.resolved) {
            if (remaining) remaining.textContent = 'Resolvido agora';
            if (caption) caption.textContent = 'Estado';
            if (fill) {
                fill.className = 'desk-sla-fill desk-sla-ok';
                fill.style.width = '100%';
            }
        }
        updateNextAction();
        window.lucide?.createIcons?.();
    }

    function getTicketNextBestAction() {
        if (state.resolved || state.status === 'resolved') {
            return { severity: 'success', icon: 'check-circle', title: 'Chamado resolvido', message: 'Atendimento encerrado. Consulte atividade ou auditoria para rastreabilidade.', label: 'Ver auditoria', type: 'audit' };
        }
        if (!state.assignedTo) {
            return { severity: 'warning', icon: 'user-plus', title: 'Chamado sem responsavel', message: 'Assuma o chamado para iniciar o atendimento.', label: 'Assumir atendimento', type: 'assign_to_me' };
        }
        if (state.slaLevel === 'critical') {
            return { severity: 'critical', icon: 'alarm-clock', title: 'SLA vencido', message: 'Registre uma atualizacao ou escale o atendimento.', label: 'Escalar', type: 'escalate' };
        }
        if (state.slaLevel === 'warning') {
            return { severity: 'warning', icon: 'timer', title: 'SLA vencendo em breve', message: 'Priorize uma atualizacao antes do vencimento.', label: 'Comentar agora', type: 'focus_comment' };
        }
        if (state.status === 'waiting_user') {
            return { severity: 'neutral', icon: 'mail-question', title: 'Aguardando retorno', message: 'Envie um lembrete ou registre uma atualizacao.', label: 'Enviar lembrete', type: 'send_reminder' };
        }
        if (state.hasEndpoint && state.hasRmmAlert) {
            return { severity: 'info', icon: 'activity', title: 'Alerta RMM ativo', message: 'Revise a telemetria antes da proxima acao.', label: 'Ver dispositivo', type: 'open_device_tab' };
        }
        if (serviceChecklistComplete) {
            return { severity: 'success', icon: 'check-circle-2', title: 'Pronto para resolucao', message: 'Checklist operacional concluido. Registre a solucao para encerrar.', label: 'Resolver chamado', type: 'resolve' };
        }
        return { severity: 'neutral', icon: 'message-square', title: 'Registrar atualizacao', message: 'Adicione contexto e avance o atendimento.', label: 'Comentar', type: 'focus_comment' };
    }

    function updateNextAction() {
        const action = getTicketNextBestAction();
        const card = document.querySelector('[data-next-action-card]');
        if (!card) return;
        card.className = `desk-panel nw-next-action-card nw-next-action-card--${action.severity}`;
        card.querySelector('[data-next-action-title]').textContent = action.title;
        card.querySelector('[data-next-action-message]').textContent = action.message;
        const button = card.querySelector('[data-next-action-button]');
        button.textContent = action.label;
        button.dataset.nextActionType = action.type;
        const secondary = card.querySelector('[data-next-action-secondary]');
        if (secondary) secondary.hidden = state.resolved || state.status === 'resolved';
        const icon = card.querySelector('.nw-next-action-card__icon i');
        if (icon) icon.setAttribute('data-lucide', action.icon);
        window.lucide?.createIcons?.();
    }

    function assignToMe() {
        const previous = state.assignedTo;
        state.assignedTo = CURRENT_USER;
        updateBadges();
        addActivity('system', 'user-check', `${CURRENT_USER} assumiu o chamado`, 'Responsavel atualizado pela acao rapida.', 'Sistema');
        addAuditEvent({
            type: 'field',
            badge: 'Campo alterado',
            action: 'Alterou responsavel',
            oldValue: previous || 'Sem responsavel',
            newValue: CURRENT_USER,
            payload: { field: 'assignee', old: previous || null, new: CURRENT_USER },
        });
        showToast(`Chamado #${state.number} atribuido a voce.`, 'Desfazer', () => {
            state.assignedTo = previous;
            updateBadges();
            addActivity('system', 'rotate-ccw', 'Atribuicao desfeita', 'Responsavel restaurado no mock local.', 'Sistema');
            addAuditEvent({
                type: 'field',
                badge: 'Campo alterado',
                action: 'Desfez atribuicao',
                oldValue: CURRENT_USER,
                newValue: previous || 'Sem responsavel',
                payload: { field: 'assignee', old: CURRENT_USER, new: previous || null },
            });
        });
    }

    function focusComment(text = '') {
        if (!textarea) return;
        if (text) textarea.value = text;
        setComposerExpanded(true);
        autoGrowTextarea(textarea);
        textarea.focus();
        textarea.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    function setComposerExpanded(expanded) {
        if (!form || !textarea) return;
        const shouldExpand = expanded || Boolean(textarea.value.trim());
        form.classList.toggle('is-expanded', shouldExpand);
        form.closest('.nw-composer-panel')?.classList.toggle('is-expanded', shouldExpand);
        if (!shouldExpand) textarea.style.height = '78px';
    }

    function autoGrowTextarea(node) {
        if (!node) return;
        const shouldExpand = form?.classList.contains('is-expanded') || Boolean(node.value.trim());
        const minHeight = shouldExpand ? 150 : 78;
        node.style.height = 'auto';
        node.style.height = `${Math.min(Math.max(node.scrollHeight, minHeight), 220)}px`;
    }

    function updateServiceChecklist(showFeedback = false) {
        const checklist = document.querySelector('[data-service-checklist]');
        if (!checklist) return;
        const checks = all('[data-service-check]', checklist);
        const done = checks.filter((check) => check.checked).length;
        const total = checks.length || 1;
        const percent = Math.round((done / total) * 100);
        serviceChecklistComplete = done === total;
        const count = checklist.querySelector('[data-service-checklist-count]');
        const stateNode = checklist.querySelector('[data-service-checklist-state]');
        const bar = checklist.querySelector('[data-service-checklist-bar]');
        if (count) count.textContent = `${done}/${total} concluido`;
        if (stateNode) stateNode.textContent = serviceChecklistComplete ? 'Checklist concluido' : 'Em andamento';
        if (bar) bar.style.width = `${percent}%`;
        checklist.classList.toggle('is-complete', serviceChecklistComplete);
        checks.forEach((check) => check.closest('label')?.classList.toggle('is-done', check.checked));
        updateNextAction();
        if (showFeedback) {
            showToast('Checklist atualizado.');
            if (serviceChecklistComplete) {
                addActivity('system', 'list-checks', 'Checklist de atendimento concluido', 'Todas as etapas operacionais foram marcadas.', 'Sistema');
            }
        }
    }

    function submitComposerComment(event, combo = 'comment') {
        const targetForm = event?.target?.closest?.('[data-detail-comment-form]') || (!event ? form : null);
        if (!targetForm) return true;
        event?.preventDefault?.();
        const body = textarea.value.trim();
        if (!body) {
            showToast('Escreva um comentario antes de enviar.');
            return false;
        }
        const visibility = targetForm.querySelector('[data-comment-visibility-value]')?.value || 'internal';
        const internal = visibility !== 'public';
        addActivity('comment', 'message-square', internal ? 'Comentario interno adicionado' : 'Comentario publico enviado', body, internal ? 'Comentario interno' : 'Comentario publico');
        addAuditEvent({
            type: 'comment',
            badge: internal ? 'Comentario interno' : 'Comentario publico',
            action: internal ? 'Criou comentario interno' : 'Criou comentario publico',
            oldValue: '-',
            newValue: body.slice(0, 48),
            payload: { field: 'comments', visibility, body },
        });
        textarea.value = '';
        setComposerExpanded(false);
        autoGrowTextarea(textarea);
        clearAttachments();
        showToast('Comentario adicionado.');

        if (combo === 'assign') assignToMe();
        if (combo === 'waiting_user') changeStatus('waiting_user');
        if (combo === 'escalate') {
            escalationDrawer.querySelector('[data-escalation-reason]').value = body;
            escalationDrawer.querySelector('[data-escalation-internal]').value = body;
            openDrawer(escalationDrawer);
        }
        if (combo === 'resolve') {
            resolutionDrawer.querySelector('[data-resolution-summary]').value = body;
            resolutionDrawer.querySelector('[data-resolution-internal-comment]').value = body;
            openDrawer(resolutionDrawer);
        }
        return true;
    }

    function updateResolutionProgress() {
        const checklist = resolutionDrawer?.querySelector('[data-resolution-checklist]');
        if (!checklist) return;
        const checks = Array.from(checklist.querySelectorAll('input[type="checkbox"]'));
        const done = checks.filter((check) => check.checked).length;
        checklist.querySelector('[data-resolution-progress]').textContent = `${done}/${checks.length} concluido`;
    }

    function resolveTicket() {
        const summary = resolutionDrawer.querySelector('[data-resolution-summary]').value.trim();
        const rootCause = resolutionDrawer.querySelector('[data-resolution-root-cause]').value.trim();
        const publicComment = resolutionDrawer.querySelector('[data-resolution-public-comment]').value.trim();
        const internalComment = resolutionDrawer.querySelector('[data-resolution-internal-comment]').value.trim();
        const kb = resolutionDrawer.querySelector('[data-resolution-kb]').checked;
        const warning = resolutionDrawer.querySelector('[data-resolution-warning]');
        const checks = Array.from(resolutionDrawer.querySelectorAll('[data-resolution-checklist] input[type="checkbox"]'));
        const done = checks.filter((check) => check.checked).length;
        if (!summary) {
            warning.hidden = false;
            warning.textContent = 'Preencha o resumo da solucao para resolver o chamado.';
            showToast('Preencha os campos obrigatorios.');
            return;
        }
        if (['high', 'critical'].includes(state.priority) && !rootCause) {
            warning.hidden = false;
            warning.textContent = 'Causa raiz e obrigatoria para prioridade Alta ou Critica.';
            showToast('Informe a causa raiz.');
            return;
        }
        if (done < checks.length) {
            warning.hidden = false;
            warning.textContent = `Checklist parcial: ${done}/${checks.length}. A resolucao sera registrada com pendencias declaradas.`;
        }
        state.status = 'resolved';
        state.statusLabel = STATUS_LABELS.resolved;
        state.resolved = true;
        updateBadges();
        addActivity('resolution', 'check-circle', `${CURRENT_USER} resolveu o chamado`, `Solucao: ${summary}`, 'Resolucao');
        addAuditEvent({
            type: 'resolution',
            badge: 'Resolucao',
            action: 'Resolveu chamado',
            oldValue: 'Em atendimento',
            newValue: 'Resolvido',
            severity: 'sensitive',
            payload: { field: 'status', old: 'Em atendimento', new: 'Resolvido', resolution_summary: summary, root_cause: rootCause },
        });
        if (publicComment) addActivity('comment', 'message-square', 'Comentario publico enviado', publicComment, 'Comentario publico');
        if (internalComment) addActivity('comment', 'message-square-lock', 'Comentario interno adicionado', internalComment, 'Comentario interno');
        if (kb) addActivity('resolution', 'book-open', 'Rascunho de artigo criado', 'Base de conhecimento preparada a partir da solucao.', 'Resolucao');
        closeDrawers();
        showToast(`Chamado #${state.number} resolvido.`);
    }

    function escalateTicket() {
        const target = escalationDrawer.querySelector('[data-escalation-target]').value.trim();
        const reason = escalationDrawer.querySelector('[data-escalation-reason]').value.trim();
        const owner = escalationDrawer.querySelector('[data-escalation-owner]').value.trim();
        const priority = escalationDrawer.querySelector('[data-escalation-priority]').value;
        const internal = escalationDrawer.querySelector('[data-escalation-internal]').value.trim();
        const warning = escalationDrawer.querySelector('[data-escalation-warning]');
        if (!target || !reason) {
            warning.hidden = false;
            warning.textContent = 'Informe o destino e o motivo do escalonamento.';
            showToast('Preencha os campos obrigatorios.');
            return;
        }
        state.status = 'escalated';
        state.statusLabel = STATUS_LABELS.escalated;
        state.assignedTo = owner || target;
        if (priority) {
            state.priority = priority;
            state.priorityLabel = PRIORITY_LABELS[priority];
            addActivity('escalation', 'flag', `Prioridade alterada para ${state.priorityLabel}`, 'Alteracao aplicada durante escalonamento.', 'Escalonamento');
        }
        updateBadges();
        addActivity('escalation', 'arrow-up-right', `Chamado escalado para ${target}`, `Motivo: ${reason}`, 'Escalonamento');
        addAuditEvent({
            type: 'escalation',
            badge: 'Escalonamento',
            action: 'Escalou chamado',
            oldValue: 'Fila N1',
            newValue: target,
            payload: { field: 'queue', old: 'N1', new: target, owner, reason },
        });
        if (internal) addActivity('comment', 'message-square-lock', 'Comentario interno adicionado', internal, 'Comentario interno');
        closeDrawers();
        showToast(`Chamado escalado para ${target}.`);
    }

    function changeStatus(status) {
        if (status === 'resolved') {
            openDrawer(resolutionDrawer);
            return;
        }
        if (status === 'escalated') {
            openDrawer(escalationDrawer);
            return;
        }
        const previous = state.statusLabel;
        state.status = status;
        state.statusLabel = STATUS_LABELS[status] || status;
        updateBadges();
        addActivity('system', 'shuffle', 'Status alterado', `${previous} -> ${state.statusLabel}`, 'Sistema');
        addAuditEvent({
            type: 'field',
            badge: 'Campo alterado',
            action: 'Atualizou status',
            oldValue: previous,
            newValue: state.statusLabel,
            payload: { field: 'status', old: previous, new: state.statusLabel },
        });
        showToast('Status atualizado.');
    }

    function changePriority(priority) {
        if (priority === 'critical') {
            const reason = window.prompt('Justificativa para prioridade Critica:');
            if (!reason) return;
            addActivity('system', 'alert-triangle', 'Justificativa de criticidade', reason, 'Sistema');
        }
        const previous = state.priorityLabel;
        state.priority = priority;
        state.priorityLabel = PRIORITY_LABELS[priority] || priority;
        updateBadges();
        addActivity('system', 'flag', 'Prioridade alterada', `${previous} -> ${state.priorityLabel}`, 'Sistema');
        addAuditEvent({
            type: 'field',
            badge: priority === 'critical' ? 'Atencao' : 'Campo alterado',
            action: 'Alterou prioridade',
            oldValue: previous,
            newValue: state.priorityLabel,
            severity: priority === 'critical' ? 'sensitive' : 'info',
            payload: { field: 'priority', old: previous, new: state.priorityLabel },
        });
        showToast('Prioridade atualizada.');
    }

    function runNextAction(type) {
        if (type === 'assign_to_me') assignToMe();
        if (type === 'escalate') openDrawer(escalationDrawer);
        if (type === 'focus_comment') focusComment();
        if (type === 'send_reminder') focusComment('Ola, seguimos aguardando seu retorno para avancar com este atendimento.');
        if (type === 'open_device_tab') window.location.hash = 'device';
        if (type === 'resolve') openDrawer(resolutionDrawer);
        if (type === 'audit') openAudit();
    }

    function openRmmConfirm(action) {
        if (!rmmConfirmModal) return;
        pendingRmmAction = action;
        const label = rmmConfirmModal.querySelector('[data-rmm-confirm-action]');
        const note = rmmConfirmModal.querySelector('[data-rmm-confirm-note]');
        if (label) label.textContent = action.label;
        if (note) note.value = '';
        rmmConfirmModal.hidden = false;
        rmmConfirmModal.querySelector('textarea')?.focus();
        window.lucide?.createIcons?.();
    }

    function closeRmmConfirm() {
        if (!rmmConfirmModal) return;
        rmmConfirmModal.hidden = true;
        pendingRmmAction = null;
    }

    function openRmmMessageModal() {
        if (!rmmMessageModal) return;
        rmmMessageModal.hidden = false;
        rmmMessageModal.querySelector('[data-rmm-message-text]')?.focus();
        window.lucide?.createIcons?.();

    function closeRmmMessageModal() {
        if (!rmmMessageModal) return;
        rmmMessageModal.hidden = true;
        const text = rmmMessageModal.querySelector('[data-rmm-message-text]');

    function executeRmmAction(action) {
        if (!action) return;
        const hostname = document.querySelector('[data-device-page]')?.dataset.endpointHostname || 'endpoint';
        if (action.key === 'open-rmm' && action.url) {
            window.open(action.url, '_blank', 'noopener');
            showToast(`Abrindo ${hostname} no RMM.`);
            addDeviceHistory('remote', 'external-link', `Endpoint aberto no RMM`, 'aberto', CURRENT_USER);
            return;
        }
        if (action.key === 'remote-access') {
            showToast(`Iniciando acesso remoto para ${hostname}.`);
            addActivity('rmm', 'screen-share', 'Acesso remoto iniciado', `${CURRENT_USER} iniciou acesso remoto para ${hostname}.`, 'RMM');
            addDeviceHistory('remote', 'screen-share', 'Acesso remoto iniciado', 'iniciado', CURRENT_USER);
            addAuditEvent({
                type: 'rmm',
                user: CURRENT_USER,
                badge: 'RMM',
                action: 'Iniciou acesso remoto',
                oldValue: '-',
                newValue: hostname,
                origin: 'Agent - RMM',
                payload: { field: 'endpoint_action', action: 'remote-access', endpoint: hostname },
            });
            return;
        }
        if (action.key === 'sync-inventory') {
            const lastSeen = document.querySelector('[data-device-last-seen]');
            const lastSeenConfirm = document.querySelector('[data-device-last-seen-confirm]');
            if (lastSeen) lastSeen.textContent = 'agora';
            if (lastSeenConfirm) lastSeenConfirm.textContent = 'agora';
            showToast(`Inventario de ${hostname} sincronizado.`);
            addActivity('rmm', 'refresh-ccw', `Endpoint ${hostname} sincronizado via RMM`, `Ultimo check-in atualizado para agora.`, 'RMM');
            addDeviceHistory('system', 'refresh-ccw', 'Inventario sincronizado', 'ok', 'NightOwl Desk');
            addAuditEvent({
                type: 'rmm',
                user: 'NightOwl RMM',
                badge: 'RMM',
                action: 'Sincronizou inventario',
                oldValue: 'check-in anterior',
                newValue: 'agora',
                origin: 'Agent - RMM',
                payload: { field: 'last_seen', endpoint: hostname, new: 'agora' },
            });
            return;
        }
        if (action.key === 'send-message') {
            openRmmMessageModal();
            return;
        }
        const title = action.label || 'Acao remota';
        const sensitive = ['restart-device', 'lock-session', 'restart-agent'].includes(action.key) || action.kind === 'script';
        showToast(`${title} enviada para ${hostname}.`);
        addActivity('rmm', action.icon || 'terminal', `Acao remota: ${title}`, `${CURRENT_USER} executou acao remota no endpoint ${hostname}.`, 'RMM');
        addDeviceHistory(action.kind || 'system', action.icon || 'terminal', title, 'enviado', CURRENT_USER);
        addAuditEvent({
            type: 'rmm',
            user: sensitive ? CURRENT_USER : 'NightOwl RMM',
            badge: sensitive ? 'Sensivel' : 'RMM',
            action: `Acao remota: ${title}`,
            oldValue: '-',
            newValue: title,
            severity: sensitive ? 'sensitive' : 'info',
            origin: 'Agent - RMM',
            payload: { field: 'endpoint_action', endpoint: hostname, action: title, sensitive },
        });
        if (action.key === 'restart-device' || action.key === 'restart-agent') {
            addDeviceHistory('system', 'power', 'Reinicializacao solicitada', 'em execucao', CURRENT_USER);
        }
    }

    function executeRmmScript(action) {
        const risk = action.risk || 'low';
        if (['medium', 'high'].includes(risk)) {
            openRmmConfirm({ ...action, icon: 'terminal', key: action.key || 'script', kind: 'script' });
            return;
        }
        executeRmmAction({ ...action, icon: 'terminal', key: action.key || 'script', kind: 'script' });
        const button = document.querySelector(`[data-rmm-script="${CSS.escape(action.key || '')}"]`);
        if (button) {
            button.dataset.originalText = button.textContent;
            button.textContent = 'Executando...';
            button.disabled = true;
        }
        window.setTimeout(() => {
            if (button) {
                button.textContent = button.dataset.originalText || 'Executar';
                button.disabled = false;
            }
            showToast(`${action.label} finalizado no mock.`);
            addDeviceHistory('script', 'check-circle-2', `${action.label} finalizado`, 'concluido', 'NightOwl');
        }, 1600);
    }

    function filterDeviceScripts() {
        const query = document.querySelector('[data-device-script-search]')?.value.trim().toLowerCase() || '';
        let visible = 0;
        all('[data-device-script-card]').forEach((card) => {
            const matchesQuery = card.textContent.toLowerCase().includes(query);
            const risk = card.dataset.scriptRiskValue || 'low';
            const matchesRisk = activeScriptRiskFilter === 'all' || risk === activeScriptRiskFilter;
            const match = matchesQuery && matchesRisk;
            card.hidden = !match;
            if (match) visible += 1;
        });
        const empty = document.querySelector('[data-device-script-empty]');
        if (empty) empty.hidden = visible > 0;
    }

    function setVisibility(mode) {
        all('[data-comment-visibility]').forEach((button) => {
            button.classList.toggle('is-active', button.dataset.commentVisibility === mode);
        });
        const value = document.querySelector('[data-comment-visibility-value]');
        const hint = document.querySelector('[data-comment-visibility-hint]');

    function insertMacro(text) {
        if (!textarea) return;
        const start = textarea.selectionStart || textarea.value.length;
        const end = textarea.selectionEnd || textarea.value.length;
        textarea.value = `${textarea.value.slice(0, start)}${text}${textarea.value.slice(end)}`;
        setComposerExpanded(true);
        textarea.focus();
        textarea.selectionStart = textarea.selectionEnd = start + text.length;
        autoGrowTextarea(textarea);

    function addAttachmentPill(name) {
        if (!attachmentsBox) return;
        attachmentsBox.hidden = false;
        const pill = document.createElement('span');
        pill.innerHTML = `<i data-lucide="paperclip"></i>${escapeHtml(name)}<button type="button" aria-label="Remover anexo">x</button>`;
        attachmentsBox.appendChild(pill);
        window.lucide?.createIcons?.();
    }

    function attachmentCards() {
        return all('[data-attachment-card]');
    }

    function attachmentData(card) {
        return {
            id: card.dataset.attachmentId,
            name: card.dataset.attachmentName,
            type: card.dataset.attachmentType,
            kind: card.dataset.attachmentKind,
            size: card.dataset.attachmentSize,
            author: card.dataset.attachmentAuthor,
            origin: card.dataset.attachmentOrigin,
            when: card.dataset.attachmentWhen,
            preview: card.dataset.attachmentPreview,
            primary: card.dataset.attachmentPrimary === '1',
        };
    }

    function updateAttachmentCounters() {
        const cards = attachmentCards();
        const counter = document.querySelector('[data-attachment-counter]');
        const primaryCounter = document.querySelector('[data-primary-evidence-counter]');
        const primary = cards.find((card) => card.dataset.attachmentPrimary === '1');
        if (counter) counter.textContent = `${cards.length} ${cards.length === 1 ? 'anexo' : 'anexos'}`;
        if (primaryCounter) primaryCounter.textContent = primary ? '1 evidencia principal' : 'sem evidencia principal';
        const primaryBox = document.querySelector('[data-primary-evidence]');
        const primaryName = document.querySelector('[data-primary-evidence-name]');
        if (primaryBox) primaryBox.hidden = !primary;
        if (primaryName && primary) primaryName.textContent = primary.dataset.attachmentName;
        const resolverEvidence = document.querySelector('.nw-evidence-box span');
        if (resolverEvidence) {
            resolverEvidence.textContent = primary ? `Evidencia principal: ${primary.dataset.attachmentName}` : 'Nenhuma evidencia principal selecionada.';
        }
        const empty = document.querySelector('[data-attachments-empty]');
        if (empty) empty.hidden = cards.length > 0;
    }

    function filterAttachments() {
        const query = document.querySelector('[data-attachment-search]')?.value.trim().toLowerCase() || '';
        let visible = 0;
        attachmentCards().forEach((card) => {
            const data = attachmentData(card);
            const haystack = `${data.name} ${data.type} ${data.author} ${data.origin}`.toLowerCase();
            const matchesQuery = haystack.includes(query);
            const matchesFilter =
                activeAttachmentFilter === 'all'
                || data.kind === activeAttachmentFilter
                || data.type === activeAttachmentFilter
                || (activeAttachmentFilter === 'evidence' && data.primary)
                || (activeAttachmentFilter === 'mine' && data.author === CURRENT_USER);
            const match = matchesQuery && matchesFilter;
            card.hidden = !match;
            if (match) visible += 1;
        });
        const filterEmpty = document.querySelector('[data-attachments-filter-empty]');
        if (filterEmpty) filterEmpty.hidden = visible > 0 || attachmentCards().length === 0;
    }

    function iconForAttachment(kind) {
        if (kind === 'image') return 'image';
        if (kind === 'pdf') return 'file-text';
        if (kind === 'log') return 'file-terminal';
        if (kind === 'archive') return 'archive';
        return 'file';
    }

    function kindForFile(name, type = '') {
        const lower = name.toLowerCase();
        if (type.startsWith('image/') || /\.(png|jpe?g|gif|webp)$/i.test(lower)) return 'image';
        if (lower.endsWith('.pdf')) return 'pdf';
        if (/\.(log|txt)$/i.test(lower)) return 'log';
        if (/\.(docx?|xlsx?|pptx?)$/i.test(lower)) return 'document';
        if (/\.(zip|rar|7z)$/i.test(lower)) return 'archive';
        return 'file';
    }

    function createAttachmentCard(fileLike, origin = 'upload manual') {
        const list = document.querySelector('[data-attachment-list]');
        if (!list) return null;
        const kind = fileLike.kind || kindForFile(fileLike.name, fileLike.type || '');
        const id = `att-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const size = fileLike.sizeLabel || (fileLike.size ? `${Math.max(1, Math.round(fileLike.size / 1024))} KB` : '128 KB');
        const card = document.createElement('article');
        card.className = 'nw-attachment-card is-uploading';
        card.dataset.attachmentCard = '';
        card.dataset.attachmentId = id;
        card.dataset.attachmentName = fileLike.name;
        card.dataset.attachmentType = kind;
        card.dataset.attachmentKind = kind;
        card.dataset.attachmentSize = size;
        card.dataset.attachmentAuthor = fileLike.author || CURRENT_USER;
        card.dataset.attachmentOrigin = origin;
        card.dataset.attachmentWhen = 'agora';
        card.dataset.attachmentPreview = fileLike.preview || 'Preview mockado do anexo.';
        card.dataset.attachmentPrimary = '0';
        card.innerHTML = `
            <button class="nw-attachment-card__main" type="button" data-attachment-preview-open>
                <span class="nw-attachment-thumb nw-attachment-thumb--${kind}"><i data-lucide="${iconForAttachment(kind)}"></i></span>
                <span class="nw-attachment-info">
                    <strong>${escapeHtml(fileLike.name)}</strong>
                    <small>${escapeHtml(size)} &middot; ${escapeHtml(fileLike.author || CURRENT_USER)} &middot; agora</small>
                    <em>${escapeHtml(origin)}</em>
                </span>
                <span class="nw-attachment-upload-progress"><i></i></span>
            </button>
            <div class="nw-attachment-actions">
                <button type="button" title="Visualizar" aria-label="Visualizar" data-attachment-preview-open><i data-lucide="eye"></i></button>
                <button type="button" title="Baixar" aria-label="Baixar" data-attachment-download><i data-lucide="download"></i></button>
                <button type="button" title="Copiar link" aria-label="Copiar link" data-attachment-copy><i data-lucide="link"></i></button>
                <button type="button" title="Marcar como evidencia" aria-label="Marcar como evidencia" data-attachment-set-primary><i data-lucide="badge-check"></i></button>
                <button type="button" title="Remover" aria-label="Remover" data-attachment-remove><i data-lucide="trash-2"></i></button>
            </div>
        `;
        list.prepend(card);
        const progress = card.querySelector('.nw-attachment-upload-progress i');
        let value = 0;
        const timer = setInterval(() => {
            value += 25;
            if (progress) progress.style.width = `${Math.min(value, 100)}%`;
            if (value >= 100) {
                clearInterval(timer);
                card.classList.remove('is-uploading');
                card.querySelector('.nw-attachment-upload-progress')?.setAttribute('hidden', '');
                showToast('Arquivo anexado.');
                addActivity('attachment', 'paperclip', 'Arquivo anexado', `${CURRENT_USER} adicionou ${fileLike.name}.`, 'Anexo');
                addAuditEvent({
                    type: 'attachment',
                    badge: 'Anexo',
                    action: 'Anexou arquivo',
                    oldValue: '-',
                    newValue: fileLike.name,
                    payload: { field: 'attachments', action: 'create', name: fileLike.name, origin },
                });
            }
        }, 180);
        updateAttachmentCounters();
        filterAttachments();
        updateAttachmentFilterCounts();
        window.lucide?.createIcons?.();
        return card;
    }

    function updateAttachmentFilterCounts() {
        const cards = attachmentCards().map(attachmentData);
        const counts = {
            all: cards.length,
            image: cards.filter((item) => item.kind === 'image').length,
            pdf: cards.filter((item) => item.kind === 'pdf').length,
            log: cards.filter((item) => item.kind === 'log').length,
            document: cards.filter((item) => item.kind === 'document').length,
            evidence: cards.filter((item) => item.primary).length,
            mine: cards.filter((item) => item.author === CURRENT_USER).length,
        };
        all('[data-attachment-filter]').forEach((button) => {
            const key = button.dataset.attachmentFilter;
            const label = button.childNodes[0]?.textContent?.trim() || button.textContent.trim().split(' ')[0];
            button.innerHTML = `${escapeHtml(label)} <span>${counts[key] || 0}</span>`;
        });
    }

    function addFilesAsAttachments(files, origin = 'upload manual') {
        const fileList = Array.from(files || []);
        if (!fileList.length) return;
        fileList.forEach((file) => createAttachmentCard(file, origin));
        showToast(fileList.length === 1 ? 'Arquivo anexado.' : `${fileList.length} arquivos anexados.`);
    }

    function setPrimaryAttachment(card) {
        if (!card) return;
        attachmentCards().forEach((item) => {
            item.dataset.attachmentPrimary = item === card ? '1' : '0';
            item.classList.toggle('is-primary', item === card);
            item.querySelector('.nw-attachment-primary-badge')?.remove();
            if (item === card) {
                const badge = document.createElement('span');
                badge.className = 'nw-attachment-primary-badge';
                badge.textContent = 'Evidencia principal';
                item.querySelector('.nw-attachment-card__main')?.appendChild(badge);
            }
        });
        updateAttachmentCounters();
        updateAttachmentFilterCounts();
        showToast('Evidencia principal atualizada.');
        addActivity('attachment', 'badge-check', 'Evidencia principal alterada', `${card.dataset.attachmentName} foi marcado como evidencia principal.`, 'Anexo');
        addAuditEvent({
            type: 'attachment',
            badge: 'Anexo',
            action: 'Marcou evidencia principal',
            oldValue: '-',
            newValue: card.dataset.attachmentName,
            payload: { field: 'primary_evidence', new: card.dataset.attachmentName },
        });
    }

    function renderAttachmentPreview(card) {
        if (!attachmentPreviewModal || !card) return;
        const data = attachmentData(card);
        currentAttachmentId = data.id;
        attachmentPreviewModal.querySelector('[data-preview-type]').textContent = data.type.toUpperCase();
        attachmentPreviewModal.querySelector('[data-preview-name]').textContent = data.name;
        attachmentPreviewModal.querySelector('[data-preview-summary]').textContent = `${data.size} - ${data.author} - ${data.when}`;
        attachmentPreviewModal.querySelector('[data-preview-author]').textContent = data.author;
        attachmentPreviewModal.querySelector('[data-preview-when]').textContent = data.when;
        attachmentPreviewModal.querySelector('[data-preview-origin]').textContent = data.origin;
        attachmentPreviewModal.querySelector('[data-preview-primary]').textContent = data.primary ? 'Evidencia principal' : 'Arquivo comum';
        const stage = attachmentPreviewModal.querySelector('[data-preview-stage]');
        if (stage) {
            if (data.kind === 'log') {
                stage.innerHTML = `<pre>${escapeHtml(data.preview || '[log mockado]')}</pre>`;
            } else if (data.kind === 'image') {
                stage.innerHTML = `<div class="nw-preview-image"><i data-lucide="image"></i><strong>${escapeHtml(data.name)}</strong><span>${escapeHtml(data.preview || 'Preview de imagem mockado')}</span></div>`;
            } else if (data.kind === 'pdf') {
                stage.innerHTML = `<div class="nw-preview-file"><i data-lucide="file-text"></i><strong>Preview PDF</strong><span>${escapeHtml(data.preview || 'PDF mockado')}</span></div>`;
            } else {
                stage.innerHTML = `<div class="nw-preview-file"><i data-lucide="${iconForAttachment(data.kind)}"></i><strong>Preview indisponivel</strong><span>${escapeHtml(data.name)}</span></div>`;
            }
        }
        attachmentPreviewModal.hidden = false;
        window.lucide?.createIcons?.();
    }

    function closeAttachmentPreview() {
        if (attachmentPreviewModal) attachmentPreviewModal.hidden = true;
        currentAttachmentId = null;
    }

    function currentAttachmentCard() {
        return attachmentCards().find((card) => card.dataset.attachmentId === currentAttachmentId);
    }

    function navigateAttachment(direction) {
        const visible = attachmentCards().filter((card) => !card.hidden);
        if (!visible.length) return;
        const index = Math.max(0, visible.indexOf(currentAttachmentCard()));
        const next = visible[(index + direction + visible.length) % visible.length];
        renderAttachmentPreview(next);
    }

    function requestAttachmentDelete(card) {
        if (!attachmentDeleteModal || !card) return;
        pendingAttachmentDelete = card;
        const name = attachmentDeleteModal.querySelector('[data-attachment-delete-name]');
        if (name) name.textContent = `${card.dataset.attachmentName} sera removido do mock local.`;
        attachmentDeleteModal.hidden = false;
    }

    function closeAttachmentDelete() {
        if (attachmentDeleteModal) attachmentDeleteModal.hidden = true;
        pendingAttachmentDelete = null;
    }

    function removeAttachment(card) {
        if (!card) return;
        const clone = card.cloneNode(true);
        const name = card.dataset.attachmentName;
        const list = document.querySelector('[data-attachment-list]');
        card.remove();
        updateAttachmentCounters();
        updateAttachmentFilterCounts();
        filterAttachments();
        addActivity('attachment', 'trash-2', 'Anexo removido', `${name} foi removido do chamado.`, 'Anexo');
        addAuditEvent({
            type: 'attachment',
            badge: 'Sensivel',
            action: 'Removeu anexo',
            oldValue: name,
            newValue: '-',
            severity: 'sensitive',
            payload: { field: 'attachments', removed: name },
        });
        showToast('Anexo removido.', 'Desfazer', () => {
            list?.prepend(clone);
            updateAttachmentCounters();
            updateAttachmentFilterCounts();
            filterAttachments();
            window.lucide?.createIcons?.();
        });
    }

    function clearAttachments() {
        if (!attachmentsBox) return;
        attachmentsBox.innerHTML = '';
        attachmentsBox.hidden = true;
    }

        if (actionButton) {
            const action = actionButton.dataset.detailAction;
            if (action === 'open-resolution') openDrawer(resolutionDrawer);
            if (action === 'open-escalation') openDrawer(escalationDrawer);
            if (action === 'open-audit') openAudit();
            if (action === 'copy-email') showToast('E-mail do solicitante copiado.');
            if (action === 'open-rmm') showToast('Abrindo endpoint no RMM.');
            if (action === 'link-endpoint') showToast('Vinculo de endpoint preparado no mock.');
            if (action === 'mention') focusComment('@');
        }
        if (event.target.closest('[data-drawer-close]')) closeDrawers();
        if (event.target.closest('[data-audit-close]')) closeAudit();
        if (event.target.closest('[data-audit-export]')) exportAuditCsv();
        if (event.target.closest('[data-audit-copy]')) copyAuditSummary();
        if (event.target.closest('[data-audit-clear]')) {
            const search = document.querySelector('[data-audit-search]');
            const type = document.querySelector('[data-audit-type]');

            const period = document.querySelector('[data-audit-period]');
            if (search) search.value = '';
            if (type) type.value = 'all';
            if (user) user.value = 'all';
            if (period) period.value = 'today';

            showToast('Filtros de auditoria limpos.');
        }
        const auditToggle = event.target.closest('[data-audit-toggle]');
        if (auditToggle) {

            if (details) details.hidden = !details.hidden;
        }
        const nextAction = event.target.closest('[data-next-action-button]');
        if (nextAction) runNextAction(nextAction.dataset.nextActionType);
        if (event.target.closest('[data-resolution-confirm]')) resolveTicket();
        if (event.target.closest('[data-resolution-draft]')) showToast('Rascunho da resolucao salvo no mock.');
        if (event.target.closest('[data-escalation-confirm]')) escalateTicket();
        if (event.target.closest('[data-resolution-attach], [data-escalation-attach]')) showToast('Anexo mockado preparado.');

        const combo = event.target.closest('[data-comment-combo]');

        const filter = event.target.closest('[data-activity-filter]');

        const historyFilter = event.target.closest('[data-device-history-filter]');
        if (historyFilter) filterDeviceHistory(historyFilter.dataset.deviceHistoryFilter);
        const showAlerts = event.target.closest('[data-device-show-alerts]');
        if (showAlerts) {
            const expanded = showAlerts.dataset.expanded === 'true';
            all('[data-device-alert].is-extra').forEach((alert) => {
                alert.hidden = expanded;
            });

        const scriptRiskFilter = event.target.closest('[data-script-risk-filter]');
        if (scriptRiskFilter) {

                button.classList.toggle('is-active', button === scriptRiskFilter);
            });
            filterDeviceScripts();
        }
        const rmmAction = event.target.closest('[data-rmm-action]');
        if (rmmAction) {
            const action = {
                key: rmmAction.dataset.rmmAction,
                label: rmmAction.dataset.actionLabel || rmmAction.textContent.trim(),
                url: rmmAction.dataset.actionUrl,
                icon: rmmAction.querySelector('i')?.getAttribute('data-lucide') || 'terminal',
            };
            if (rmmAction.dataset.actionSensitive === 'true') openRmmConfirm(action);
            else executeRmmAction(action);
        }
        const rmmScript = event.target.closest('[data-rmm-script]');
        if (rmmScript) {
            executeRmmScript({
                key: rmmScript.dataset.rmmScript,
                label: rmmScript.dataset.actionLabel || rmmScript.textContent.trim(),
                risk: rmmScript.dataset.scriptRisk || 'low',
            });
        }
        if (event.target.closest('[data-attachment-pick]')) {
            document.querySelector('[data-attachment-file-input]')?.click();
        }
        const summaryPreview = event.target.closest('[data-attachment-summary-preview]');
        if (summaryPreview) {
            const card = attachmentCards().find((item) => item.dataset.attachmentId === summaryPreview.dataset.attachmentSummaryPreview);
            if (card) renderAttachmentPreview(card);
            else window.location.hash = 'attachments';
        }
        const summaryCopy = event.target.closest('[data-attachment-summary-copy]');
        if (summaryCopy) {
            navigator.clipboard?.writeText(`${window.location.origin}/tickets/${state.number}/attachments/${summaryCopy.dataset.attachmentSummaryCopy}/`);
            showToast('Link do anexo copiado.');
        }
        if (event.target.closest('[data-attachment-download-all]')) {
            showToast('Download de todos os anexos preparado no mock.');
        }
        const relatedPreview = event.target.closest('[data-related-preview]');
        if (relatedPreview) {
            event.preventDefault();
            const card = relatedPreview.closest('[data-related-card]');
            if (card) renderRelatedPreview(card);
        }
        const relatedSelect = event.target.closest('[data-related-select]');
        if (relatedSelect) updateRelatedSelection();
        if (event.target.closest('[data-related-link-open]')) {
            event.preventDefault();
            openRelatedLinkModal();
        }
        if (event.target.closest('[data-related-merge-open]')) {
            event.preventDefault();
            openRelatedMergeModal();
        }
        const relatedReference = event.target.closest('[data-related-reference]');
        if (relatedReference) {
            event.preventDefault();
            openReferenceSolution(relatedReference.closest('[data-related-card]') || document.querySelector('[data-related-card].is-active'));
        }
        const relatedMore = event.target.closest('[data-related-more]');
        if (relatedMore) {
            event.preventDefault();
            const card = relatedMore.closest('[data-related-card]');
            if (card?.dataset.relatedResolved === '1') openReferenceSolution(card);
            else showToast('Mais acoes do relacionado preparadas no mock.');
        }
        if (event.target.closest('[data-related-modal-close]')) closeRelatedModals();
        if (event.target.closest('[data-reference-copy]')) {
            const text = currentReferenceCard ? relatedSolution(currentReferenceCard) : '';
            navigator.clipboard?.writeText(text);
            showToast('Solucao copiada.');
        }
        if (event.target.closest('[data-reference-insert]')) {
            if (currentReferenceCard) focusComment(relatedSolution(currentReferenceCard));
            closeRelatedModals();
        }
        if (event.target.closest('[data-reference-link]') && currentReferenceCard) {
            addManualRelated(currentReferenceCard.dataset.relatedNumber, currentReferenceCard.dataset.relatedTitle, currentReferenceCard.dataset.relatedRequester, currentReferenceCard.dataset.relatedEndpoint, 'referencia');
            addActivity('system', 'book-open', `Chamado #${currentReferenceCard.dataset.relatedNumber} vinculado como referencia`, relatedSolution(currentReferenceCard), 'Sistema');
            addAuditEvent({
                type: 'relationship',
                badge: 'Relacionamento',
                action: 'Vinculou referencia',
                oldValue: '-',
                newValue: `#${currentReferenceCard.dataset.relatedNumber}`,
                payload: { field: 'related_ticket', new: `#${currentReferenceCard.dataset.relatedNumber}`, reason: 'referencia' },
            });
            showToast('Chamado vinculado como referencia.');
            closeRelatedModals();
        }
        if (event.target.closest('[data-attachment-paste-hint]')) {
            showToast('Use Ctrl+V nesta tela para colar um print como anexo.');
        }
        const attachmentFilter = event.target.closest('[data-attachment-filter]');
        if (attachmentFilter) {
            activeAttachmentFilter = attachmentFilter.dataset.attachmentFilter;
            all('[data-attachment-filter]').forEach((button) => button.classList.toggle('is-active', button === attachmentFilter));
            filterAttachments();
        }
        if (event.target.closest('[data-attachment-clear-filters]')) {
            activeAttachmentFilter = 'all';
            all('[data-attachment-filter]').forEach((button) => button.classList.toggle('is-active', button.dataset.attachmentFilter === 'all'));
            const search = document.querySelector('[data-attachment-search]');
            if (search) search.value = '';
            filterAttachments();
            showToast('Filtros de anexos limpos.');
        }
        const attachmentCard = event.target.closest('[data-attachment-card]');
        if (event.target.closest('[data-attachment-preview-open]') && attachmentCard) renderAttachmentPreview(attachmentCard);
        if (event.target.closest('[data-primary-evidence-preview]')) {
            const primary = attachmentCards().find((card) => card.dataset.attachmentPrimary === '1');
            if (primary) renderAttachmentPreview(primary);
        }
        if (event.target.closest('[data-attachment-copy]') && attachmentCard) {
            navigator.clipboard?.writeText(`${window.location.origin}/tickets/${state.number}/attachments/${attachmentCard.dataset.attachmentId}/`);
            showToast('Link do anexo copiado.');
        }
        if (event.target.closest('[data-attachment-download]') && attachmentCard) {
            showToast(`Download de ${attachmentCard.dataset.attachmentName} iniciado no mock.`);
        }
        if (event.target.closest('[data-attachment-set-primary]') && attachmentCard) setPrimaryAttachment(attachmentCard);
        if (event.target.closest('[data-attachment-remove]') && attachmentCard) requestAttachmentDelete(attachmentCard);
        if (event.target.closest('[data-attachment-preview-close]')) closeAttachmentPreview();
        if (event.target.closest('[data-attachment-prev]')) navigateAttachment(-1);
        if (event.target.closest('[data-attachment-next]')) navigateAttachment(1);
        if (event.target.closest('[data-preview-copy]')) {
            const card = currentAttachmentCard();
            if (card) {
                navigator.clipboard?.writeText(`${window.location.origin}/tickets/${state.number}/attachments/${card.dataset.attachmentId}/`);
                showToast('Link do anexo copiado.');
            }
        }
        if (event.target.closest('[data-preview-download]')) {
            const card = currentAttachmentCard();
            if (card) showToast(`Download de ${card.dataset.attachmentName} iniciado no mock.`);
        }
        if (event.target.closest('[data-preview-primary-action]')) {
            const card = currentAttachmentCard();
            if (card) setPrimaryAttachment(card);

        if (event.target.closest('[data-preview-remove]')) {
            const card = currentAttachmentCard();
            if (card) requestAttachmentDelete(card);

        if (event.target.closest('[data-attachment-delete-close]')) closeAttachmentDelete();
        if (event.target.closest('[data-rmm-confirm-close]')) closeRmmConfirm();
        if (event.target.closest('[data-rmm-message-close]')) closeRmmMessageModal();
        const messageTemplate = event.target.closest('[data-rmm-message-template]');
        if (messageTemplate) {
            const text = rmmMessageModal?.querySelector('[data-rmm-message-text]');
            if (text) {
                text.value = messageTemplate.dataset.rmmMessageTemplate;

        const linkEndpoint = event.target.closest('[data-device-link]');
        if (linkEndpoint) linkMockEndpoint(linkEndpoint.dataset.deviceLink);
        const status = event.target.closest('[data-quick-status]');
        if (status) changeStatus(status.dataset.quickStatus);
        const priority = event.target.closest('[data-quick-priority]');
        if (priority) changePriority(priority.dataset.quickPriority);
        const category = event.target.closest('[data-quick-category]');
        if (category) {
            const previous = state.category;
            state.category = category.dataset.quickCategory;

                type: 'field',
                badge: 'Campo alterado',
                action: 'Alterou categoria',
                oldValue: previous,
                newValue: state.category,
                payload: { field: 'category', old: previous, new: state.category },
            });
            showToast('Categoria atualizada.');
        }
        const assignee = event.target.closest('[data-quick-assignee]');
        if (assignee) {
            const previous = state.assignedTo || 'Sem responsavel';
            state.assignedTo = assignee.dataset.quickAssignee;
            updateBadges();
            addActivity('system', 'user-check', 'Responsavel alterado', `${previous} -> ${state.assignedTo || 'Sem responsavel'}`, 'Sistema');
            addAuditEvent({
                type: 'field',
                badge: 'Campo alterado',
                action: 'Alterou responsavel',
                oldValue: previous,
                newValue: state.assignedTo || 'Sem responsavel',
                payload: { field: 'assignee', old: previous, new: state.assignedTo || null },
            });
            showToast('Responsavel atualizado.');

        const removeAttachment = event.target.closest('[data-comment-attachments] button');
        if (removeAttachment) {
            removeAttachment.closest('span')?.remove();
            if (attachmentsBox && !attachmentsBox.children.length) attachmentsBox.hidden = true;
        }
    });

    rmmConfirmModal?.querySelector('[data-rmm-confirm-form]')?.addEventListener('submit', (event) => {

    rmmMessageModal?.querySelector('[data-rmm-message-form]')?.addEventListener('submit', (event) => {

        closeAttachmentDelete();
        removeAttachment(card);
