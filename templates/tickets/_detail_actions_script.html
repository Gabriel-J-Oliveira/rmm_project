            type: 'relationship',
            badge: 'Relacionamento',
            action: 'Vinculou chamado',
            oldValue: '-',
            newValue: `#${selected.value}`,
            payload: { field: 'related_ticket', new: `#${selected.value}`, reason, comment },
        });
        showToast('Chamado vinculado.');
        const commentField = relatedLinkModal.querySelector('[data-related-link-comment]');
        if (commentField) commentField.value = '';
        closeRelatedModals();
    });
    relatedMergeModal?.querySelector('[data-related-merge-form]')?.addEventListener('submit', (event) => {
        event.preventDefault();
        const reason = relatedMergeModal.querySelector('[data-related-merge-reason]')?.value.trim();
        if (!reason) {
            showToast('Informe o motivo da mesclagem.');
            return;
        }
        const selected = selectedRelatedCards();
        const primary = relatedMergeModal.querySelector('input[name="merge_primary"]:checked')?.value || selected[0]?.dataset.relatedNumber;
        moveMergedCards(primary, reason);
        addActivity('system', 'git-merge', `Chamados mesclados com #${primary}`, `${selected.map((card) => `#${card.dataset.relatedNumber}`).join(', ')} foram marcados como duplicados. Motivo: ${reason}`, 'Sistema');
        addAuditEvent({
            type: 'relationship',
            badge: 'Sensivel',
            action: 'Mesclou chamados',
            oldValue: selected.map((card) => `#${card.dataset.relatedNumber}`).join(', '),
            newValue: `#${primary} principal`,
            severity: 'sensitive',
            payload: { action: 'merge', primary: `#${primary}`, secondary: selected.map((card) => `#${card.dataset.relatedNumber}`), reason },
        });
        showToast('Chamados mesclados.');
        const reasonField = relatedMergeModal.querySelector('[data-related-merge-reason]');
        if (reasonField) reasonField.value = '';
        closeRelatedModals();
    });
    document.addEventListener('input', (event) => {
        if (event.target.matches('[data-macro-search]')) {
            const query = event.target.value.trim().toLowerCase();
            const popover = event.target.closest('.desk-popover');
            let visible = 0;
            all('[data-comment-macro]', popover).forEach((button) => {
                const match = button.textContent.toLowerCase().includes(query);
                button.hidden = !match;
                if (match) visible += 1;
            });
            const empty = popover.querySelector('[data-macro-empty]');
            if (empty) empty.hidden = visible > 0;
        }
        if (event.target.matches('[data-detail-comment-textarea]')) {
            const draft = document.querySelector('[data-composer-draft]');
            if (draft) draft.hidden = !event.target.value.trim();
            setComposerExpanded(Boolean(event.target.value.trim()) || document.activeElement === event.target);
            autoGrowTextarea(event.target);
        }
        if (event.target.matches('[data-device-script-search]')) {
            filterDeviceScripts();
        }
        if (event.target.matches('[data-device-link-search]')) {
            const query = event.target.value.trim().toLowerCase();
            let visible = 0;
            all('[data-device-link-card]').forEach((card) => {
                const match = card.textContent.toLowerCase().includes(query);
                card.hidden = !match;
                if (match) visible += 1;
            });
            const empty = document.querySelector('[data-device-link-empty]');
            if (empty) empty.hidden = visible > 0;
        }
        if (event.target.matches('[data-attachment-search]')) {
            filterAttachments();
        }
        if (event.target.matches('[data-related-link-search]')) {
            const query = event.target.value.trim().toLowerCase();
            all('[data-related-link-result]').forEach((row) => {
                row.hidden = !row.textContent.toLowerCase().includes(query);
            });
        }
        if (event.target.matches('[data-audit-search]')) {
            filterAudit();
        }
    });
    document.addEventListener('change', (event) => {
        if (event.target.matches('[data-comment-file]')) {
            Array.from(event.target.files || []).forEach((file) => {
                addAttachmentPill(file.name);
                createAttachmentCard(file, 'comentario');
            });
            event.target.value = '';
        }
        if (event.target.matches('[data-service-check]')) {
            updateServiceChecklist(true);
        }
        if (event.target.matches('[data-attachment-file-input]')) {
            addFilesAsAttachments(event.target.files, 'upload manual');
            event.target.value = '';
        }
        if (event.target.matches('[data-attachment-sort]')) {
            const list = document.querySelector('[data-attachment-list]');
            const cards = attachmentCards();
            const value = event.target.value;
            const sorted = cards.sort((a, b) => {
                if (value === 'name') return a.dataset.attachmentName.localeCompare(b.dataset.attachmentName);
                if (value === 'size') return a.dataset.attachmentSize.localeCompare(b.dataset.attachmentSize);
                return value === 'oldest' ? 1 : -1;
            });
            sorted.forEach((card) => list?.appendChild(card));
            filterAttachments();
        }
        if (event.target.matches('[data-audit-type], [data-audit-user], [data-audit-period]')) {
            filterAudit();
        }
    });
    document.addEventListener('dragover', (event) => {
        const dropzone = event.target.closest('[data-attachment-dropzone]');
        if (!dropzone) return;
        event.preventDefault();
        dropzone.classList.add('is-dragging');
        const title = dropzone.querySelector('[data-dropzone-title]');
        if (title) title.textContent = 'Solte para anexar ao chamado';
    });
    document.addEventListener('dragleave', (event) => {
        const dropzone = event.target.closest('[data-attachment-dropzone]');
        if (!dropzone) return;
        dropzone.classList.remove('is-dragging');
        const title = dropzone.querySelector('[data-dropzone-title]');
        if (title) title.textContent = 'Solte arquivos ou cole prints com Ctrl+V';
    });
    document.addEventListener('drop', (event) => {
        const dropzone = event.target.closest('[data-attachment-dropzone]');
        if (!dropzone) return;
        event.preventDefault();
        dropzone.classList.remove('is-dragging');
        const title = dropzone.querySelector('[data-dropzone-title]');
        if (title) title.textContent = 'Solte arquivos ou cole prints com Ctrl+V';
        addFilesAsAttachments(event.dataTransfer?.files, 'upload manual');
    });
    document.addEventListener('focusin', (event) => {
        if (event.target.matches('[data-detail-comment-textarea]')) {
            setComposerExpanded(true);
            autoGrowTextarea(event.target);
        }
    });
    document.addEventListener('focusout', (event) => {
        if (event.target.matches('[data-detail-comment-textarea]')) {
            window.setTimeout(() => {
                if (!event.target.value.trim() && document.activeElement !== event.target) {
                    setComposerExpanded(false);
                    autoGrowTextarea(event.target);
                }
            }, 80);
        }
    });
    document.addEventListener('paste', (event) => {
        const hasImage = Array.from(event.clipboardData?.items || []).some((item) => item.type.startsWith('image/'));
        if (hasImage && event.target.closest('[data-detail-comment-form]')) {
            addAttachmentPill('imagem-colada.png');
            showToast('Imagem colada como anexo.');
        }
        if (hasImage && !event.target.closest('[data-detail-comment-form]') && document.querySelector('[data-attachments-page]')) {
            const stamp = new Date().toISOString().slice(0, 16).replace(/[-T:]/g, '');
            createAttachmentCard({
                name: `print-colado-${stamp}.png`,
                kind: 'image',
                sizeLabel: '320 KB',
                preview: 'Print colado da area de transferencia.',
            }, 'print colado');
            showToast('Print colado como anexo.');
            addActivity('attachment', 'image', 'Print colado', 'Imagem colada como anexo do chamado.', 'Anexo');
            addAuditEvent({
                type: 'attachment',
                badge: 'Anexo',
                action: 'Print colado',
                oldValue: '-',
                newValue: `print-colado-${stamp}.png`,
                payload: { field: 'attachments', action: 'paste_image', name: `print-colado-${stamp}.png` },
            });
        }
    });
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeDrawers();
        if (event.key === 'Escape') closeAudit();
        if (event.key === 'Escape') closeRmmConfirm();
        if (event.key === 'Escape') closeRmmMessageModal();
        if (event.key === 'Escape') {
            closeAttachmentPreview();
            closeAttachmentDelete();
            closeRelatedModals();
        }
        if (attachmentPreviewModal && !attachmentPreviewModal.hidden && event.key === 'ArrowLeft') navigateAttachment(-1);
        if (attachmentPreviewModal && !attachmentPreviewModal.hidden && event.key === 'ArrowRight') navigateAttachment(1);
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
            const sourceForm = event.target.closest('[data-detail-comment-form]');
            if (sourceForm) submitComposerComment({ target: sourceForm, preventDefault() {} });
        }
    });
    resolutionDrawer?.querySelectorAll('[data-resolution-checklist] input[type="checkbox"]').forEach((check) => {
        check.addEventListener('change', () => {
            updateResolutionProgress();
            showToast('Checklist atualizado.');
        });
    });
    resolutionDrawer?.querySelector('[data-resolution-kb]')?.addEventListener('change', (event) => {
        resolutionDrawer.querySelector('[data-resolution-kb-title-wrap]').hidden = !event.target.checked;
    });
    toast?.querySelector('button')?.addEventListener('click', () => {
        const undo = toastUndo;
        toastUndo = null;
        toast.hidden = true;
        undo?.();
    });

    updateResolutionProgress();
    updateServiceChecklist(false);
    setComposerExpanded(false);
    autoGrowTextarea(textarea);
    updateActivityCounts();
    filterActivity('all');
    updateAttachmentCounters();
    updateAttachmentFilterCounts();
    filterAttachments();
    updateRelatedCounts();
    updateRelatedSelection();
    updateNextAction();
})();
</script>
