<section data-admin-auth data-url="{% url 'terminal-session-request' endpoint.pk %}">
  <h2>Autenticação administrativa</h2>
  <p>Validação de acesso Windows; o terminal ainda não será iniciado.</p>
  <form autocomplete="off">{% csrf_token %}
    <label>Usuário Windows <input name="account" maxlength="256" required autocomplete="off"></label>
    <label>Domínio (vazio para conta local) <input name="domain" maxlength="256" autocomplete="off"></label>
    <label>Senha <input name="password" type="password" maxlength="512" required autocomplete="new-password"></label>
    <button type="submit">Validar</button><button type="button" data-cancel>Cancelar</button>
  </form>
  <p role="status" data-status>Aguardando solicitação</p>
</section>
