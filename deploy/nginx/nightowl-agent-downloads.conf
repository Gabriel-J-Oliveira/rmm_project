# NightOwl agent HTTPS downloads
#
# Include inside the HTTPS server block for rmm.controlsul.com/nightowl.controlsul.com.
# The installer and ZIP are intentionally public; activation is protected by
# enrollment token and per-endpoint agent token.

location /downloads/nightowl-agent/ {
    alias /opt/nightowl/downloads/agent/windows/;
    autoindex off;
    add_header Cache-Control "no-store";
}
